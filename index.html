                      <input type="time" required className="w-full p-3 bg-slate-50 border rounded-2xl" value={formConsulta.hora} onChange={e => setFormConsulta({...formConsulta, hora: e.target.value})} />
                    </div>
                  </div>

                  <div>
                    <label className="font-bold text-slate-600 block mb-1">Status do Atendimento</label>
                    <select className="w-full p-3 bg-slate-50 border rounded-2xl font-bold" value={formConsulta.status} onChange={e => setFormConsulta({...formConsulta, status: e.target.value})}>
                      <option value="Agendado">Agendado</option>
                      <option value="Concluído">Concluído</option>
                      <option value="Cancelado">Cancelado</option>
                    </select>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-bold text-slate-600 block mb-1">Valor (R$)</label>
                      <input type="number" className="w-full p-3 bg-slate-50 border rounded-2xl" value={formConsulta.valor} onChange={e => setFormConsulta({...formConsulta, valor: e.target.value})} />
                    </div>
                    <div>
                      <label className="font-bold text-slate-600 block mb-1">Status Pagamento</label>
                      <select 
                        className="w-full p-3 bg-slate-50 border rounded-2xl font-bold"
                        value={formConsulta.status_pagamento}
                        onChange={e => setFormConsulta({...formConsulta, status_pagamento: e.target.value})}
                      >
                        <option value="Pendente">⏳ Pendente</option>
                        <option value="Recebido">✅ Recebido</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="font-bold text-slate-600 block mb-1">Observação (Opcional)</label>
                    <textarea 
                      placeholder="Notas ou detalhes adicionais sobre o agendamento..." 
                      className="w-full p-3 bg-slate-50 border rounded-2xl h-16" 
                      value={formConsulta.observacoes} 
                      onChange={e => setFormConsulta({...formConsulta, observacoes: e.target.value})} 
                    />
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button type="button" onClick={() => setShowEditarConsulta(false)} className="w-1/2 p-3 bg-slate-100 font-bold rounded-2xl text-slate-600">Cancelar</button>
                    <button type="submit" className="w-1/2 p-3 bg-rose-900 font-bold text-white rounded-2xl">Salvar Alterações</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL ANEXAR DOCUMENTO / FOTO */}
          {showNovoDoc && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-4">
              <div className="bg-white w-full max-w-md rounded-3xl p-5 space-y-4">
                <h3 className="text-sm font-bold text-slate-800 uppercase tracking-wider">Anexar Documento / Foto</h3>
                <form onSubmit={handleAddDocumento} className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold text-slate-600 block mb-1">Título *</label>
                    <input required placeholder="Ex: Foto Antes / Depois, Exame de Sangue" className="w-full p-3 bg-slate-50 border rounded-2xl" value={formDoc.titulo} onChange={e => setFormDoc({...formDoc, titulo: e.target.value})} />
                  </div>
                  <div>
                    <label className="font-bold text-slate-600 block mb-1">Descrição (Opcional)</label>
                    <textarea placeholder="Detalhes adicionais sobre o documento..." className="w-full p-3 bg-slate-50 border rounded-2xl h-16" value={formDoc.descricao} onChange={e => setFormDoc({...formDoc, descricao: e.target.value})} />
                  </div>
                  <div>
                    <label className="font-bold text-slate-600 block mb-1">Selecione a Pasta / Categoria *</label>
                    <select 
                      className="w-full p-3 bg-slate-50 border rounded-2xl" 
                      value={formDoc.categoria} 
                      onChange={e => setFormDoc({...formDoc, categoria: e.target.value})}
                    >
                      <option value="Fotos">📸 Fotos (Antes / Depois)</option>
                      <option value="Fichas">📝 Fichas & Prontuários (Impressos)</option>
                      <option value="Termos">📄 Termos & Contratos</option>
                      <option value="Exames">📑 Exames & Laudos</option>
                      <option value="Outros">📌 Outros Documentos</option>
                    </select>
                  </div>
                  <div>
                    <label className="font-bold text-slate-600 block mb-1">Escolher Foto / Ficheiro *</label>
                    <input type="file" accept="image/*,.pdf" required onChange={e => setFormDoc({ ...formDoc, file: e.target.files[0] })} className="w-full p-2 text-xs text-slate-500 bg-slate-50 border rounded-2xl file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-rose-900 file:text-white" />
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button type="button" onClick={() => setShowNovoDoc(false)} className="w-1/2 p-3 bg-slate-100 font-bold rounded-2xl text-slate-600">Cancelar</button>
                    <button type="submit" disabled={uploading} className="w-1/2 p-3 bg-rose-900 font-bold text-white rounded-2xl">
                      {uploading ? 'A enviar...' : 'Adicionar'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Menu Flutuante Inferior */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto glass-nav border-t border-slate-200/80 px-4 py-2 flex justify-around text-[10px] font-bold text-slate-400 z-20 shadow-2xl">
            <button onClick={() => { setActiveTab('dashboard'); setSelectedPaciente(null); }} className={`flex flex-col items-center gap-1 ${activeTab === 'dashboard' ? 'text-rose-900 font-black' : ''}`}>
              <IconHome /> <span>Início</span>
            </button>
            <button onClick={() => { setActiveTab('pacientes'); setSelectedPaciente(null); }} className={`flex flex-col items-center gap-1 ${activeTab === 'pacientes' ? 'text-rose-900 font-black' : ''}`}>
              <IconUsers /> <span>Pacientes</span>
            </button>
            <button onClick={() => { setActiveTab('agenda'); setSelectedPaciente(null); }} className={`flex flex-col items-center gap-1 ${activeTab === 'agenda' ? 'text-rose-900 font-black' : ''}`}>
              <IconCalendar /> <span>Agenda</span>
            </button>
            <button onClick={() => { setActiveTab('financeiro'); setSelectedPaciente(null); }} className={`flex flex-col items-center gap-1 ${activeTab === 'financeiro' ? 'text-rose-900 font-black' : ''}`}>
              <IconDollar /> <span>Financeiro</span>
            </button>
          </nav>

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
