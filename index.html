  <!-- React e React DOM -->

</head>
<body class="text-slate-800 pb-24">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // === CONFIGURAÇÃO DO SUPABASE ===
    const SUPABASE_URL = "https://paklhqzhfjxpczdxkxdd.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBha2xocXpoZmp4cGN6ZHhreGRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNjI4MTQsImV4cCI6MjEwMjgzODgxNH0.QkXUEil4UjfEQ75r4FzpZQ7y2SnZVSil8CBK2dDo3u8";

    const isSupabaseConfigured = SUPABASE_URL && SUPABASE_ANON_KEY;
    const supabase = isSupabaseConfigured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    // PROCEDIMENTOS PRÉ-DEFINIDOS
    const PROCEDIMENTOS_PRESET = [
      { nome: "Limpeza de Pele", valor: "" },
      { nome: "Preenchimento Facial", valor: "" },
      { nome: "Auriculoterapia", valor: "" },
      { nome: "Botox", valor: "" },
      { nome: "Bioestimulador", valor: "" },
      { nome: "Outro Procedimento...", valor: "" }
    ];

    // OPÇÕES DE SESSÃO
    const OPCOES_SESSAO = [
      "Sessão Única",
      "1ª Sessão (Primeira)",
      "2ª Sessão (Segunda)",
      "3ª Sessão (Terceira)",
      "4ª Sessão (Quarta)",
      "5ª Sessão (Quinta)",
      "6ª Sessão (Sexta)",
      "7ª Sessão (Sétima)",
      "8ª Sessão (Oitava)",
      "9ª Sessão (Nona)",
      "10ª Sessão (Décima)",
      "11ª Sessão (Décima Primeira)",
      "12ª Sessão (Décima Segunda)",
      "13ª Sessão (Décima Terceira)",
      "14ª Sessão (Décima Quarta)",
      "15ª Sessão (Décima Quinta)",
      "16ª Sessão (Décima Sexta)",
      "17ª Sessão (Décima Sétima)",
      "18ª Sessão (Décima Oitava)",
      "19ª Sessão (Décima Nona)",
      "20ª Sessão (Vigésima)"
    ];

    // SCHEMA DE PERGUNTAS ESPECÍFICAS POR TIPO DE FICHA
    const QUESTOES_POR_FICHA = {
      "Avaliação Facial": [
        { id: "alergias_medicamentos", label: "Alergias ou uso contínuo de medicamentos?", placeholder: "Ex: Alergia a Dipirona, toma anticoncepcional..." },
        { id: "doencas_cronicas", label: "Possui doenças crônicas ou autoimunes?", placeholder: "Ex: Hipertensão, Diabetes, Hashimoto..." },
        { id: "gestante_lactante", label: "Está gestante ou amamentando?", type: "select", options: ["Não", "Sim - Gestante", "Sim - Lactante"] }
      ]
    };

    const TIPOS_ANAMNESE = Object.keys(QUESTOES_POR_FICHA);

    // Ícones SVG
    const IconHome = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>;
    const IconUsers = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>;
    const IconCalendar = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>;
    const IconDollar = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>;
    const IconPlus = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>;
    const IconSearch = () => <svg className="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>;
    const IconEdit = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>;
    const IconTrash = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>;
    const IconCamera = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>;
    const IconCheck = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 13l4 4L19 7"/></svg>;

    function App() {
      const todayStr = new Date().toISOString().split('T')[0];

      const [activeTab, setActiveTab] = useState('dashboard');
      const [pacientes, setPacientes] = useState([]);
      const [consultas, setConsultas] = useState([]);
      const [fichasAnamnese, setFichasAnamnese] = useState([]);
      const [busca, setBusca] = useState('');
      const [dataFiltro, setDataFiltro] = useState(todayStr);
      const [selectedPaciente, setSelectedPaciente] = useState(null);
      const [documentos, setDocumentos] = useState([]);
      const [categoriaFiltro, setCategoriaFiltro] = useState('Todas');
      const [filtroFinanceiro, setFiltroFinanceiro] = useState('Futuros');
      const [loading, setLoading] = useState(false);
      const [uploading, setUploading] = useState(false);
      const [modoPacienteManual, setModoPacienteManual] = useState(false);

      // Aniversariantes do dia
      const [aniversariantesHoje, setAniversariantesHoje] = useState([]);
      const [showPopupAniversario, setShowPopupAniversario] = useState(false);

      // Modais
      const [showNovoPaciente, setShowNovoPaciente] = useState(false);
      const [showEditarPaciente, setShowEditarPaciente] = useState(false);
      const [showNovaConsulta, setShowNovaConsulta] = useState(false);
      const [showEditarConsulta, setShowEditarConsulta] = useState(false);
      const [showNovoDoc, setShowNovoDoc] = useState(false);
      const [showNovaFicha, setShowNovaFicha] = useState(false);
      const [selectedFichaVer, setSelectedFichaVer] = useState(null);

      // Formulários
      const [formPaciente, setFormPaciente] = useState({ nome: '', telefone: '', data_nascimento: '', observacoes: '' });
      const [formDoc, setFormDoc] = useState({ titulo: '', descricao: '', categoria: 'Fotos', file: null });
      const [formConsulta, setFormConsulta] = useState({
        id: null,
        paciente_id: '',
        paciente_nome: '',
        procedimento: PROCEDIMENTOS_PRESET[0].nome,
        procedimento_custom: '',
        sessao: OPCOES_SESSAO[0],
        data: todayStr,
        hora: '14:00',
        valor: '',
        status: 'Agendado',
        status_pagamento: 'Pendente',
        observacoes: ''
      });

      const [formFicha, setFormFicha] = useState({
        tipo_ficha: TIPOS_ANAMNESE[0],
        data: todayStr,
        queixa_principal: '',
        avaliacao_medica: '',
        respostas_especificas: {}
      });

      useEffect(() => {
        if (isSupabaseConfigured) {
          carregarDados();
        }
      }, []);

      useEffect(() => {
        if (selectedPaciente && isSupabaseConfigured) {
          carregarDocumentos(selectedPaciente.id);
          carregarFichas(selectedPaciente.id);
        }
      }, [selectedPaciente]);

      // VERIFICAÇÃO DE ANIVERSARIANTES DO DIA
      useEffect(() => {
        if (pacientes.length > 0) {
          const today = new Date();
          const mm = String(today.getMonth() + 1).padStart(2, '0');
          const dd = String(today.getDate()).padStart(2, '0');
          const todayMMDD = `${mm}-${dd}`;

          const niverHoje = pacientes.filter(p => {
            if (!p.data_nascimento) return false;
            const parts = p.data_nascimento.split('-');
            if (parts.length < 3) return false;
            const [, pMonth, pDay] = parts;
            return `${pMonth}-${pDay}` === todayMMDD;
          });

          setAniversariantesHoje(niverHoje);

          const keyNaoMostrar = `hide_birthday_popup_${todayStr}`;
          const jaFechouHoje = localStorage.getItem(keyNaoMostrar);

          if (niverHoje.length > 0 && !jaFechouHoje) {
            setShowPopupAniversario(true);
          }
        }
      }, [pacientes]);

      function handleFecharPopupAniversario(naoMostrarMais = false) {
        if (naoMostrarMais) {
          localStorage.setItem(`hide_birthday_popup_${todayStr}`, 'true');
        }
        setShowPopupAniversario(false);
      }

      async function carregarDados() {
        setLoading(true);
        try {
          const { data: pData } = await supabase.from('pacientes').select('*').order('nome', { ascending: true });
          if (pData) setPacientes(pData);

          const { data: cData } = await supabase.from('consultas').select('*').order('data', { ascending: true }).order('hora', { ascending: true });
          if (cData) setConsultas(cData);
        } catch (err) {
          console.error("Erro ao carregar dados:", err);
        } finally {
          setLoading(false);
        }
      }

      async function carregarDocumentos(pacienteId) {
        try {
          const { data, error } = await supabase.from('documentos').select('*').eq('paciente_id', pacienteId).order('created_at', { ascending: false });
          if (!error && data) setDocumentos(data);
        } catch (err) {
          console.error("Erro ao carregar documentos:", err);
        }
      }

      async function carregarFichas(pacienteId) {
        try {
          const { data, error } = await supabase.from('fichas_anamnese').select('*').eq('paciente_id', pacienteId).order('data', { ascending: false });
          if (!error && data) setFichasAnamnese(data);
        } catch (err) {
          console.error("Erro ao carregar fichas de anamnese:", err);
        }
      }

      // --- PACIENTES ---
      async function handleAddPaciente(e) {
        e.preventDefault();
        if (!formPaciente.nome || !formPaciente.telefone) return alert("Por favor, preencha o nome e o telefone da paciente.");

        const { data, error } = await supabase.from('pacientes').insert([formPaciente]).select();

        if (error) {
          alert("Erro ao guardar paciente: " + error.message);
        } else if (data) {
          setPacientes([...pacientes, data[0]].sort((a,b) => a.nome.localeCompare(b.nome)));
          setFormPaciente({ nome: '', telefone: '', data_nascimento: '', observacoes: '' });
          setShowNovoPaciente(false);
        }
      }

      function handleAbrirEditar(paciente) {
        setFormPaciente({
          nome: paciente.nome || '',
          telefone: paciente.telefone || '',
          data_nascimento: paciente.data_nascimento || '',
          observacoes: paciente.observacoes || ''
        });
        setShowEditarPaciente(true);
      }

      async function handleSalvarEdicao(e) {
        e.preventDefault();
        if (!selectedPaciente) return;

        const { data, error } = await supabase
          .from('pacientes')
          .update(formPaciente)
          .eq('id', selectedPaciente.id)
          .select();

        if (error) {
          alert("Erro ao atualizar: " + error.message);
        } else if (data) {
          const atualizados = pacientes.map(p => p.id === selectedPaciente.id ? data[0] : p);
          setPacientes(atualizados);
          setSelectedPaciente(data[0]);
          setShowEditarPaciente(false);
        }
      }

      async function handleExcluirPaciente(id) {
        if (confirm("Tem certeza que deseja excluir esta paciente? Esta ação não pode ser desfeita.")) {
          const { error } = await supabase.from('pacientes').delete().eq('id', id);
          if (error) {
            alert("Erro ao eliminar paciente: " + error.message);
          } else {
            setPacientes(pacientes.filter(p => p.id !== id));
            setSelectedPaciente(null);
          }
        }
      }

      // --- FICHAS DE ANAMNESE DIGITAL ---
      async function handleSalvarFicha(e) {
        e.preventDefault();
        if (!selectedPaciente) return;

        const payload = {
          paciente_id: selectedPaciente.id,
          tipo_ficha: formFicha.tipo_ficha,
          data: formFicha.data,
          queixa_principal: formFicha.queixa_principal,
          avaliacao_medica: formFicha.avaliacao_medica,
          respostas_especificas: formFicha.respostas_especificas
        };

        const { data, error } = await supabase.from('fichas_anamnese').insert([payload]).select();

        if (error) {
          alert("Erro ao salvar ficha: " + error.message);
        } else if (data) {
          setFichasAnamnese([data[0], ...fichasAnamnese]);
          setShowNovaFicha(false);
          setFormFicha({
            tipo_ficha: TIPOS_ANAMNESE[0],
            data: todayStr,
            queixa_principal: '',
            avaliacao_medica: '',
            respostas_especificas: {}
          });
          alert("Ficha de Anamnese salva com sucesso!");
        }
      }

      async function handleExcluirFicha(fichaId) {
        if (confirm("Deseja excluir esta ficha de anamnese?")) {
          const { error } = await supabase.from('fichas_anamnese').delete().eq('id', fichaId);
          if (error) {
            alert("Erro ao excluir ficha: " + error.message);
          } else {
            setFichasAnamnese(fichasAnamnese.filter(f => f.id !== fichaId));
            if (selectedFichaVer && selectedFichaVer.id === fichaId) setSelectedFichaVer(null);
          }
        }
      }

      // --- FOTOS E DOCUMENTOS ---
      async function handleAddDocumento(e) {
        e.preventDefault();
        if (!formDoc.titulo || !formDoc.file || !selectedPaciente) {
          return alert("Preencha o título e selecione um ficheiro.");
        }

        setUploading(true);
        try {
          const file = formDoc.file;
          const fileExt = file.name.split('.').pop();
          const fileName = `${selectedPaciente.id}/${formDoc.categoria}/${Date.now()}.${fileExt}`;

          const { error: uploadErr } = await supabase.storage
            .from('prontuarios')
            .upload(fileName, file);

          if (uploadErr) throw uploadErr;

          const { data: urlData } = supabase.storage.from('prontuarios').getPublicUrl(fileName);
          const publicUrl = urlData.publicUrl;

          const novoDoc = {
            paciente_id: selectedPaciente.id,
            titulo: formDoc.titulo,
            descricao: formDoc.descricao || '',
            categoria: formDoc.categoria,
            url: publicUrl,
            tipo: file.type.includes('image') ? 'imagem' : 'documento'
          };

          const { data: docData, error: docErr } = await supabase.from('documentos').insert([novoDoc]).select();

          if (docErr) throw docErr;

          if (docData) {
            setDocumentos([docData[0], ...documentos]);
            setFormDoc({ titulo: '', descricao: '', categoria: 'Fotos', file: null });
            setShowNovoDoc(false);
            alert("Ficheiro salvo com sucesso na pasta " + formDoc.categoria + "!");
          }
        } catch (err) {
          alert("Erro no envio do ficheiro: " + (err.message || "Erro desconhecido."));
        } finally {
          setUploading(false);
        }
      }

      async function handleExcluirDoc(docId) {
        if (confirm("Deseja remover este documento?")) {
          const { error } = await supabase.from('documentos').delete().eq('id', docId);
          if (error) {
            alert("Erro ao eliminar documento: " + error.message);
          } else {
            setDocumentos(documentos.filter(d => d.id !== docId));
          }
        }
      }

      // --- AGENDA / CONSULTAS & FINANCEIRO ---
      function handleAbrirNovoAgendamento(pacientePreSelecionado = null) {
        if (pacientePreSelecionado) {
          setModoPacienteManual(false);
          setFormConsulta({
            id: null,
            paciente_id: pacientePreSelecionado.id,
            paciente_nome: pacientePreSelecionado.nome,
            procedimento: PROCEDIMENTOS_PRESET[0].nome,
            procedimento_custom: '',
            sessao: OPCOES_SESSAO[0],
            data: todayStr,
            hora: '14:00',
            valor: '',
            status: 'Agendado',
            status_pagamento: 'Pendente',
            observacoes: ''
          });
        } else {
          setModoPacienteManual(pacientes.length === 0);
          setFormConsulta({
            id: null,
            paciente_id: pacientes[0]?.id || '',
            paciente_nome: pacientes[0]?.nome || '',
            procedimento: PROCEDIMENTOS_PRESET[0].nome,
            procedimento_custom: '',
            sessao: OPCOES_SESSAO[0],
            data: todayStr,
            hora: '14:00',
            valor: '',
            status: 'Agendado',
            status_pagamento: 'Pendente',
            observacoes: ''
          });
        }
        setShowNovaConsulta(true);
      }

      function handleProcedimentoChange(nomeProcedimento) {
        setFormConsulta({
          ...formConsulta,
          procedimento: nomeProcedimento
        });
      }

      function handlePacienteSelect(e) {
        const pacId = e.target.value;
        const pObj = pacientes.find(p => p.id === pacId);
        setFormConsulta({
          ...formConsulta,
          paciente_id: pacId,
          paciente_nome: pObj ? pObj.nome : ''
        });
      }

      async function handleAddConsulta(e) {
        e.preventDefault();
        const procFinal = formConsulta.procedimento === "Outro Procedimento..." ? formConsulta.procedimento_custom : formConsulta.procedimento;
        if (!procFinal || !formConsulta.paciente_nome) return alert("Informe o nome da paciente e o procedimento.");

        const payload = {
          paciente_id: formConsulta.paciente_id || null,
          paciente_nome: formConsulta.paciente_nome,
          procedimento: procFinal,
          sessao: formConsulta.sessao || OPCOES_SESSAO[0],
          data: formConsulta.data,
          hora: formConsulta.hora,
          data_hora: formConsulta.data && formConsulta.hora ? `${formConsulta.data}T${formConsulta.hora}:00` : null,
          valor: Number(formConsulta.valor || 0),
          status: formConsulta.status || 'Agendado',
          status_pagamento: formConsulta.status_pagamento || 'Pendente',
          observacoes: formConsulta.observacoes || ''
        };

        const { data, error } = await supabase.from('consultas').insert([payload]).select();

        if (error) {
          alert("Erro ao agendar consulta: " + error.message);
        } else if (data) {
          setConsultas([...consultas, data[0]]);
          setShowNovaConsulta(false);
          alert("Agendamento criado com sucesso!");
        }
      }

      function handleAbrirEditarConsulta(c) {
        setFormConsulta({
          id: c.id,
          paciente_id: c.paciente_id || '',
          paciente_nome: c.paciente_nome || '',
          procedimento: c.procedimento,
          procedimento_custom: '',
          sessao: c.sessao || OPCOES_SESSAO[0],
          data: c.data || todayStr,
          hora: c.hora || '14:00',
          valor: c.valor || '',
          status: c.status || 'Agendado',
          status_pagamento: c.status_pagamento || 'Pendente',
          observacoes: c.observacoes || ''
        });
        setShowEditarConsulta(true);
      }

      async function handleSalvarEdicaoConsulta(e) {
        e.preventDefault();
        const procFinal = formConsulta.procedimento === "Outro Procedimento..." ? formConsulta.procedimento_custom : formConsulta.procedimento;

        const payload = {
          paciente_id: formConsulta.paciente_id || null,
          paciente_nome: formConsulta.paciente_nome,
          procedimento: procFinal,
          sessao: formConsulta.sessao || OPCOES_SESSAO[0],
          data: formConsulta.data,
          hora: formConsulta.hora,
          data_hora: formConsulta.data && formConsulta.hora ? `${formConsulta.data}T${formConsulta.hora}:00` : null,
          valor: Number(formConsulta.valor || 0),
          status: formConsulta.status,
          status_pagamento: formConsulta.status_pagamento || 'Pendente',
          observacoes: formConsulta.observacoes || ''
        };

        const { data, error } = await supabase.from('consultas').update(payload).eq('id', formConsulta.id).select();

        if (error) {
          alert("Erro ao atualizar consulta: " + error.message);
        } else if (data) {
          setConsultas(consultas.map(c => c.id === formConsulta.id ? data[0] : c));
          setShowEditarConsulta(false);
        }
      }

      async function handleConfirmarPagamento(id) {
        const { data, error } = await supabase
          .from('consultas')
          .update({ status_pagamento: 'Recebido' })
          .eq('id', id)
          .select();

        if (error) {
          alert("Erro ao confirmar pagamento: " + error.message);
        } else if (data) {
          setConsultas(consultas.map(c => c.id === id ? data[0] : c));
        }
      }

      async function handleExcluirConsulta(id) {
        if (confirm("Deseja cancelar/excluir este agendamento?")) {
          const { error } = await supabase.from('consultas').delete().eq('id', id);
          if (error) {
            alert("Erro ao excluir consulta: " + error.message);
          } else {
            setConsultas(consultas.filter(c => c.id !== id));
          }
        }
      }

      // Filtros e Cálculos
      const pacientesFiltrados = pacientes.filter(p => 
        (p.nome && p.nome.toLowerCase().includes(busca.toLowerCase())) || 
        (p.telefone && p.telefone.includes(busca))
      );

      const documentosFiltrados = documentos.filter(d => 
        categoriaFiltro === 'Todas' || (d.categoria || 'Fotos') === categoriaFiltro
      );

      const consultasDoDia = consultas.filter(c => {
        const dataConsulta = c.data || (c.data_hora ? c.data_hora.split('T')[0] : '');
        return dataConsulta === dataFiltro;
      });

      // CÁLCULOS FINANCEIROS
      const consultasValidas = consultas.filter(c => c.status !== 'Cancelado');
      const valorAReceber = consultasValidas
        .filter(c => (c.status_pagamento || 'Pendente') === 'Pendente')
        .reduce((acc, c) => acc + Number(c.valor || 0), 0);

      const valorRecebido = consultasValidas
        .filter(c => c.status_pagamento === 'Recebido')
        .reduce((acc, c) => acc + Number(c.valor || 0), 0);

      const previsaoTotal = valorAReceber + valorRecebido;

      const consultasFinanceiro = consultasValidas.filter(c => {
        const pag = c.status_pagamento || 'Pendente';
        if (filtroFinanceiro === 'Futuros') return pag === 'Pendente';
        if (filtroFinanceiro === 'Recebidos') return pag === 'Recebido';
        return true;
      });

      const questoesAtuais = QUESTOES_POR_FICHA[formFicha.tipo_ficha] || [];

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col bg-[#faf7f8]/90 backdrop-blur-sm shadow-2xl">
          
          <header className="bg-gradient-to-r from-rose-950/95 via-rose-900/95 to-rose-950/95 text-white p-5 rounded-b-3xl shadow-lg flex justify-between items-center sticky top-0 z-20 border-b border-rose-800/40 backdrop-blur-md">
            <div>
              <span className="text-[10px] uppercase tracking-widest text-rose-300 font-bold block">Clínica Médica</span>
              <h1 className="text-lg font-bold tracking-tight text-rose-50">Dra. Isabella Duarte</h1>
            </div>
            <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-rose-700 to-rose-900 border border-rose-500/30 flex items-center justify-center font-extrabold text-xs text-rose-100 shadow-inner">
              ID
            </div>
          </header>

          <main className="flex-1 p-4 space-y-4">

            {/* DASHBOARD */}
            {activeTab === 'dashboard' && (
              <div className="space-y-4">

                {/* BANNER DE ANIVERSARIANTES DO DIA */}
                {aniversariantesHoje.length > 0 && (
                  <div className="bg-gradient-to-r from-amber-500 to-rose-600 text-white p-4 rounded-3xl shadow-md flex items-center justify-between">
                    <div className="flex items-center gap-3">
                      <span className="text-2xl">🎂</span>
                      <div>
                        <p className="text-[10px] uppercase font-bold text-amber-100 tracking-wider">Aniversariante(s) de Hoje</p>
                        <p className="text-xs font-extrabold mt-0.5">
                          {aniversariantesHoje.map(p => p.nome).join(', ')}
                        </p>
                      </div>
                    </div>
                    <button 
                      onClick={() => setShowPopupAniversario(true)} 
                      className="px-3 py-1.5 bg-white/20 hover:bg-white/30 backdrop-blur-md rounded-xl text-xs font-bold text-white border border-white/20 active:scale-95 transition-all"
                    >
                      Ver
                    </button>
                  </div>
                )}

                <div className="bg-gradient-to-br from-rose-900 via-rose-800 to-rose-950 text-white p-5 rounded-3xl shadow-md">
                  <p className="text-[11px] text-rose-200 uppercase tracking-widest font-semibold">Resumo Geral</p>
                  <h2 className="text-2xl font-extrabold mt-0.5 text-white">Hoje</h2>
                  <div className="grid grid-cols-2 gap-3 mt-4">
                    <div className="bg-white/10 backdrop-blur-md p-3.5 rounded-2xl border border-white/10">
                      <p className="text-[11px] text-rose-200">Atendimentos Hoje</p>
                      <p className="text-2xl font-black mt-0.5">{consultas.filter(c => (c.data || (c.data_hora ? c.data_hora.split('T')[0] : '')) === todayStr).length}</p>
                    </div>
                    <div className="bg-white/10 backdrop-blur-md p-3.5 rounded-2xl border border-white/10">
                      <p className="text-[11px] text-rose-200">Total Pacientes</p>
                      <p className="text-2xl font-black mt-0.5">{pacientes.length}</p>
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <button onClick={() => setShowNovoPaciente(true)} className="p-4 bg-white/90 backdrop-blur-md border border-rose-100/80 rounded-2xl shadow-sm text-left flex items-center justify-between active:scale-95 transition-all">
                    <div>
                      <p className="text-xs font-bold text-slate-800">+ Paciente</p>
                      <p className="text-[10px] text-slate-400 mt-0.5">Novo cadastro</p>
                    </div>
                    <div className="w-8 h-8 rounded-xl bg-rose-50 text-rose-700 flex items-center justify-center"><IconUsers /></div>
                  </button>

                  <button onClick={() => handleAbrirNovoAgendamento()} className="p-4 bg-white/90 backdrop-blur-md border border-rose-100/80 rounded-2xl shadow-sm text-left flex items-center justify-between active:scale-95 transition-all">
                    <div>
                      <p className="text-xs font-bold text-slate-800">+ Agendar</p>
                      <p className="text-[10px] text-slate-400 mt-0.5">Nova consulta</p>
                    </div>
                    <div className="w-8 h-8 rounded-xl bg-rose-50 text-rose-700 flex items-center justify-center"><IconCalendar /></div>
                  </button>
                </div>

                {/* LOGO CENTRALIZADO COM 50% DE OPACIDADE */}
                <div className="flex justify-center items-center py-10 my-auto min-h-[220px]">
                  <img 
                    src="logo.png" 
                    alt="Logo Dra. Isabella Duarte" 
                    className="max-w-[220px] w-full object-contain opacity-50 select-none pointer-events-none"
                    onError={(e) => {
                      if (!e.target.src.endsWith('logo.jpg')) {
                        e.target.src = 'logo.jpg';
                      }
                    }}
                  />
                </div>

              </div>
            )}

            {/* PACIENTES */}
            {activeTab === 'pacientes' && !selectedPaciente && (
              <div className="space-y-3">
                <div className="flex justify-between items-center">
                  <h2 className="text-sm font-bold text-slate-800 uppercase tracking-wider">Prontuário de Pacientes</h2>
                  <button onClick={() => setShowNovoPaciente(true)} className="px-3 py-1.5 bg-rose-900 text-white rounded-xl text-xs font-bold flex items-center gap-1 shadow-sm active:scale-95">
                    <IconPlus /> <span>Cadastrar</span>
                  </button>
                </div>

                <div className="relative">
                  <div className="absolute inset-y-0 left-3 flex items-center pointer-events-none"><IconSearch /></div>
                  <input 
                    type="text" 
                    placeholder="Buscar por nome ou telefone..." 
                    className="w-full pl-9 pr-4 py-2.5 bg-white/90 backdrop-blur-sm border border-slate-200 rounded-2xl text-xs focus:outline-none focus:ring-2 focus:ring-rose-500/20"
                    value={busca}
                    onChange={e => setBusca(e.target.value)}
                  />
                </div>

                {loading ? (
                  <div className="text-center py-8 text-xs text-slate-400">A carregar pacientes...</div>
                ) : pacientesFiltrados.length === 0 ? (
                  <div className="text-center py-8 text-xs text-slate-400">Nenhum paciente cadastrado.</div>
                ) : (
                  <div className="space-y-2">
                    {pacientesFiltrados.map(p => (
                      <div 
                        key={p.id} 
                        onClick={() => setSelectedPaciente(p)}
                        className="p-3.5 bg-white/90 backdrop-blur-md border border-slate-100 rounded-2xl shadow-sm flex items-center justify-between active:bg-rose-50/50 transition-colors cursor-pointer"
                      >
                        <div className="space-y-1">
                          <p className="font-bold text-slate-800 text-xs">{p.nome}</p>
                          <p className="text-[11px] text-slate-400">{p.telefone || 'Sem telefone'}</p>
                        </div>
                        <span className="text-slate-300 text-base font-bold">›</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* PERFIL DO PACIENTE */}
            {selectedPaciente && (
              <div className="space-y-4">
                <div className="flex justify-between items-center">
                  <button onClick={() => setSelectedPaciente(null)} className="text-xs text-rose-800 font-bold flex items-center gap-1 bg-white/90 backdrop-blur-md px-3 py-1.5 rounded-xl border border-slate-200 shadow-sm">
                    ‹ Voltar para Lista
                  </button>

                  <div className="flex items-center gap-2">
                    <button onClick={() => handleAbrirNovoAgendamento(selectedPaciente)} className="p-2 bg-rose-900 text-white rounded-xl shadow-sm font-bold text-xs flex items-center gap-1">
                      <IconCalendar /> <span>Agendar</span>
                    </button>
                    <button onClick={() => handleAbrirEditar(selectedPaciente)} className="p-2 bg-amber-50 text-amber-800 rounded-xl border border-amber-200 font-bold text-xs flex items-center gap-1">
                      <IconEdit />
                    </button>
                    <button onClick={() => handleExcluirPaciente(selectedPaciente.id)} className="p-2 bg-rose-50 text-rose-800 rounded-xl border border-rose-200 font-bold text-xs flex items-center gap-1">
                      <IconTrash />
                    </button>
                  </div>
                </div>

                {/* DADOS BÁSICOS */}
                <div className="bg-white/90 backdrop-blur-md p-4 rounded-3xl shadow-sm border border-slate-100 space-y-3">
                  <div className="flex justify-between items-start">
                    <div>
                      <h2 className="text-base font-extrabold text-slate-800">{selectedPaciente.nome}</h2>
                      <p className="text-xs text-slate-500 mt-0.5">📞 <strong>Tel:</strong> {selectedPaciente.telefone || 'Não informado'}</p>
                      <p className="text-xs text-slate-500">🎂 <strong>Nascimento:</strong> {selectedPaciente.data_nascimento ? new Date(selectedPaciente.data_nascimento + 'T00:00:00').toLocaleDateString('pt-BR') : 'Não informada'}</p>
                    </div>
                  </div>

                  {selectedPaciente.observacoes && (
                    <p className="text-xs text-slate-600 bg-slate-50/80 p-3 rounded-2xl border border-slate-100">
                      <strong>Observações:</strong> {selectedPaciente.observacoes}
                    </p>
                  )}
                </div>

                {/* FICHAS DE ANAMNESE DIGITAL */}
                <div className="bg-white/90 backdrop-blur-md p-4 rounded-3xl shadow-sm border border-slate-100 space-y-3">
                  <div className="flex justify-between items-center">
                    <div>
                      <h3 className="text-xs font-bold text-slate-800 uppercase tracking-wider">Fichas de Anamnese Digital</h3>
                      <p className="text-[10px] text-slate-400">Preenchidas na consulta pela Dra. Isabella</p>
                    </div>
                    <button onClick={() => setShowNovaFicha(true)} className="px-3 py-1.5 bg-rose-900 text-white text-xs font-bold rounded-xl flex items-center gap-1 shadow-sm">
                      <IconPlus /> <span>Preencher</span>
                    </button>
                  </div>

                  {fichasAnamnese.length === 0 ? (
                    <div className="text-center py-6 border border-dashed border-slate-200 rounded-2xl bg-slate-50/50">
                      <p className="text-xs text-slate-400">Nenhuma ficha digital preenchida ainda.</p>
                    </div>
                  ) : (
                    <div className="space-y-2">
                      {fichasAnamnese.map(f => (
                        <div key={f.id} className="p-3 bg-slate-50/80 border border-slate-200 rounded-2xl flex justify-between items-center">
                          <div>
                            <span className="text-[10px] font-bold px-2 py-0.5 bg-rose-100 text-rose-900 rounded-lg block w-fit mb-1">
                              {f.tipo_ficha}
                            </span>
                            <p className="text-xs font-bold text-slate-800">
                              Data: {new Date(f.data + 'T00:00:00').toLocaleDateString('pt-BR')}
                            </p>
                            {f.queixa_principal && (
                              <p className="text-[11px] text-slate-500 truncate max-w-[200px]">Queixa: {f.queixa_principal}</p>
                            )}
                          </div>
                          <div className="flex gap-1">
                            <button onClick={() => setSelectedFichaVer(f)} className="px-2.5 py-1 bg-white border rounded-xl text-xs font-bold text-slate-700 shadow-sm">
                              Ver
                            </button>
                            <button onClick={() => handleExcluirFicha(f.id)} className="p-1.5 text-rose-600">
                              <IconTrash />
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* GALERIA DE FOTOS/DOCUMENTOS DO PACIENTE */}
                <div className="bg-white/90 backdrop-blur-md p-4 rounded-3xl shadow-sm border border-slate-100 space-y-3">
                  <div className="flex justify-between items-center">
                    <div>
                      <h3 className="text-xs font-bold text-slate-800 uppercase tracking-wider">Fotos & Anexos do Paciente</h3>
                      <p className="text-[10px] text-slate-400">Fotos da ficha impressa, exames e termos</p>
                    </div>
                    <button onClick={() => setShowNovoDoc(true)} className="px-3 py-1.5 bg-rose-900 text-white text-xs font-bold rounded-xl flex items-center gap-1 shadow-sm">
                      <IconCamera /> <span>Anexar</span>
                    </button>
                  </div>

                  <div className="flex gap-1.5 overflow-x-auto pb-1 text-[11px]">
                    {['Todas', 'Fotos', 'Termos', 'Exames', 'Fichas', 'Outros'].map(cat => (
                      <button 
                        key={cat} 
                        onClick={() => setCategoriaFiltro(cat)}
                        className={`px-3 py-1 rounded-xl font-bold whitespace-nowrap transition-all ${
                          categoriaFiltro === cat 
                            ? 'bg-rose-900 text-white shadow-sm' 
                            : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                        }`}
                      >
                        {cat}
                      </button>
                    ))}
                  </div>

                  {documentosFiltrados.length === 0 ? (
                    <div className="text-center py-6 border border-dashed border-slate-200 rounded-2xl bg-slate-50/50">
                      <p className="text-xs text-slate-400">Nenhum documento na categoria "{categoriaFiltro}".</p>
                    </div>
                  ) : (
                    <div className="grid grid-cols-2 gap-3">
                      {documentosFiltrados.map(doc => (
                        <div key={doc.id} className="relative bg-slate-50 border border-slate-200 rounded-2xl overflow-hidden p-2">
                          <span className="absolute top-3 left-3 z-10 px-2 py-0.5 bg-black/60 backdrop-blur-sm text-white text-[9px] font-bold rounded-lg">
                            {doc.categoria || 'Fotos'}
                          </span>
                          
                          {doc.tipo === 'imagem' ? (
                            <img src={doc.url} alt={doc.titulo} className="w-full h-28 object-cover rounded-xl" />
                          ) : (
                            <div className="w-full h-28 bg-rose-50 rounded-xl flex items-center justify-center text-rose-800 font-bold text-xs flex-col gap-1">
                              📄 Ficheiro
                            </div>
                          )}
                          <div className="mt-2 flex justify-between items-center px-1">
                            <div>
                              <p className="text-[10px] font-bold text-slate-800 truncate max-w-[100px]">{doc.titulo}</p>
                              {doc.descricao && <p className="text-[9px] text-slate-500 truncate max-w-[100px]">{doc.descricao}</p>}
                              <p className="text-[9px] text-slate-400">{new Date(doc.created_at).toLocaleDateString('pt-BR')}</p>
                            </div>
                            <button onClick={() => handleExcluirDoc(doc.id)} className="text-rose-600 p-1">
                              <IconTrash />
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

              </div>
            )}

            {/* AGENDA COMPLETA */}
            {activeTab === 'agenda' && (
              <div className="space-y-4">
                <div className="flex justify-between items-center">
                  <h2 className="text-sm font-bold text-slate-800 uppercase tracking-wider">Agenda de Atendimentos</h2>
                  <button 
                    onClick={() => handleAbrirNovoAgendamento()} 
                    className="px-3.5 py-2 bg-rose-900 text-white rounded-xl text-xs font-bold flex items-center gap-1 shadow-md active:scale-95"
                  >
                    <IconPlus /> <span>Incluir Agendamento</span>
                  </button>
                </div>

                {/* Seleção de Data */}
                <div className="bg-white/90 backdrop-blur-md p-3 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between">
                  <span className="text-xs font-bold text-slate-600">Filtrar por Data:</span>
                  <input 
                    type="date" 
                    className="p-2 bg-slate-50 border rounded-xl text-xs font-bold text-slate-800"
                    value={dataFiltro}
                    onChange={e => setDataFiltro(e.target.value)}
                  />
                </div>

                {consultasDoDia.length === 0 ? (
                  <div className="text-center py-10 border border-dashed border-slate-200 rounded-3xl bg-white/90 backdrop-blur-md space-y-3">
                    <p className="text-xs text-slate-400">Nenhuma consulta agendada para este dia.</p>
                    <button 
                      onClick={() => handleAbrirNovoAgendamento()} 
                      className="px-4 py-2 bg-rose-50 text-rose-900 border border-rose-200 text-xs font-bold rounded-xl"
                    >
                      + Incluir Agendamento
                    </button>
                  </div>
                ) : (
                  <div className="space-y-2.5">
                    {consultasDoDia.map(c => {
                      const foiPago = c.status_pagamento === 'Recebido';
                      return (
                        <div key={c.id} className="p-4 bg-white/90 backdrop-blur-md rounded-2xl border border-slate-100 shadow-sm space-y-2.5">
                          <div className="flex justify-between items-start">
                            <div>
                              <div className="flex items-center gap-2 flex-wrap">
                                <span className="text-xs font-extrabold text-slate-900">{c.hora || '14:00'}</span>
                                <span className={`px-2 py-0.5 text-[9px] font-bold rounded-lg ${
                                  c.status === 'Concluído' ? 'bg-emerald-100 text-emerald-800' :
                                  c.status === 'Cancelado' ? 'bg-rose-100 text-rose-800' :
                                  'bg-amber-100 text-amber-800'
                                }`}>
                                  {c.status || 'Agendado'}
                                </span>
                                {c.sessao && (
                                  <span className="px-2 py-0.5 text-[9px] font-extrabold rounded-lg bg-rose-100 text-rose-900">
                                    {c.sessao}
                                  </span>
                                )}
                              </div>
                              <h3 className="font-bold text-slate-800 text-sm mt-1">{c.paciente_nome}</h3>
                              <p className="text-xs text-rose-900 font-semibold">{c.procedimento}</p>

                              {c.observacoes && (
                                <p className="text-[11px] text-slate-600 mt-2 bg-slate-50/80 p-2.5 rounded-xl border border-slate-100">
                                  📝 <strong>Obs:</strong> {c.observacoes}
                                </p>
                              )}
                            </div>
                            
                            <div className="text-right">
                              <span className="font-extrabold text-slate-900 text-xs block">
                                R$ {Number(c.valor || 0).toFixed(2)}
                              </span>
                              <div className="flex gap-1 mt-2 justify-end">
                                <button onClick={() => handleAbrirEditarConsulta(c)} className="p-1.5 bg-slate-100 text-slate-700 rounded-lg">
                                  <IconEdit />
                                </button>
                                <button onClick={() => handleExcluirConsulta(c.id)} className="p-1.5 bg-rose-50 text-rose-700 rounded-lg">
                                  <IconTrash />
                                </button>
                              </div>
                            </div>
                          </div>

                          {/* BARRA DE STATUS FINANCEIRO NO CARD DA AGENDA */}
                          <div className="pt-2 border-t border-slate-100 flex justify-between items-center text-xs">
                            <span className="text-[11px] text-slate-500 font-medium">Pagamento:</span>
                            {foiPago ? (
                              <span className="px-2.5 py-1 bg-emerald-50 text-emerald-700 border border-emerald-200 text-[10px] font-bold rounded-xl flex items-center gap-1">
                                <IconCheck /> <span>Pago</span>
                              </span>
                            ) : (
                              <button 
                                onClick={() => handleConfirmarPagamento(c.id)}
                                className="px-2.5 py-1 bg-emerald-100 hover:bg-emerald-200 text-emerald-900 text-[10px] font-extrabold rounded-xl transition-all flex items-center gap-1 shadow-sm active:scale-95"
                              >
                                <IconCheck /> <span>Dar Baixa</span>
                              </button>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}

            {/* FINANCEIRO */}
            {activeTab === 'financeiro' && (
              <div className="space-y-4">
                <h2 className="text-sm font-bold text-slate-800 uppercase tracking-wider">Controle Financeiro</h2>

                {/* MÉTRICAS PRINCIPAIS */}
                <div className="grid grid-cols-2 gap-3">
                  <div className="bg-amber-500/90 backdrop-blur-md text-white p-4 rounded-3xl shadow-sm border border-amber-400">
                    <p className="text-[10px] uppercase font-bold text-amber-100 tracking-wider">⏳ Lançamentos Futuros</p>
                    <p className="text-xl font-black mt-1">R$ {valorAReceber.toFixed(2)}</p>
                    <p className="text-[9px] text-amber-100 mt-1">A receber</p>
                  </div>

                  <div className="bg-emerald-700/90 backdrop-blur-md text-white p-4 rounded-3xl shadow-sm border border-emerald-600">
                    <p className="text-[10px] uppercase font-bold text-emerald-100 tracking-wider">✅ Entrou em Caixa</p>
                    <p className="text-xl font-black mt-1">R$ {valorRecebido.toFixed(2)}</p>
                    <p className="text-[9px] text-emerald-100 mt-1">Confirmado</p>
                  </div>
                </div>

                <div className="bg-gradient-to-r from-slate-900/95 to-slate-800/95 text-white p-4 rounded-2xl shadow-sm flex justify-between items-center backdrop-blur-md">
                  <div>
                    <p className="text-[10px] uppercase font-bold text-slate-400">Previsão Total (Em Caixa + Futuro)</p>
                    <p className="text-lg font-black mt-0.5">R$ {previsaoTotal.toFixed(2)}</p>
                  </div>
                  <span className="text-xl">💰</span>
                </div>

                {/* ABAS DE FILTRO DO FINANCEIRO */}
                <div className="flex bg-slate-200/70 p-1 rounded-2xl text-xs font-bold text-slate-600 gap-1 backdrop-blur-sm">
                  <button 
                    onClick={() => setFiltroFinanceiro('Futuros')}
                    className={`flex-1 py-2 rounded-xl text-center transition-all ${
                      filtroFinanceiro === 'Futuros' ? 'bg-white text-slate-900 shadow-sm font-extrabold' : 'hover:text-slate-900'
                    }`}
                  >
                    ⏳ Lançamentos Futuros
                  </button>
                  <button 
                    onClick={() => setFiltroFinanceiro('Recebidos')}
                    className={`flex-1 py-2 rounded-xl text-center transition-all ${
                      filtroFinanceiro === 'Recebidos' ? 'bg-white text-slate-900 shadow-sm font-extrabold' : 'hover:text-slate-900'
                    }`}
                  >
                    ✅ Recebidos
                  </button>
                  <button 
                    onClick={() => setFiltroFinanceiro('Todos')}
                    className={`px-3 py-2 rounded-xl text-center transition-all ${
                      filtroFinanceiro === 'Todos' ? 'bg-white text-slate-900 shadow-sm font-extrabold' : 'hover:text-slate-900'
                    }`}
                  >
                    Todos
                  </button>
                </div>

                {/* LISTAGEM DOS LANÇAMENTOS */}
                {consultasFinanceiro.length === 0 ? (
                  <div className="text-center py-10 border border-dashed border-slate-200 rounded-3xl bg-white/90 backdrop-blur-md">
                    <p className="text-xs text-slate-400">Nenhum lançamento nesta categoria.</p>
                  </div>
                ) : (
                  <div className="space-y-2.5">
                    {consultasFinanceiro.map(c => {
                      const foiPago = c.status_pagamento === 'Recebido';
                      const dataExibicao = c.data || (c.data_hora ? c.data_hora.split('T')[0] : '');
                      return (
                        <div key={c.id} className="p-4 bg-white/90 backdrop-blur-md border border-slate-100 rounded-2xl shadow-sm space-y-2">
                          <div className="flex justify-between items-start">
                            <div>
                              <p className="text-[10px] text-slate-400 font-bold">
                                📅 {dataExibicao ? new Date(dataExibicao + 'T00:00:00').toLocaleDateString('pt-BR') : 'Data não definida'} às {c.hora || '14:00'}
                              </p>
                              <h3 className="font-bold text-slate-800 text-sm mt-0.5">{c.paciente_nome}</h3>
                              <p className="text-xs text-rose-900 font-semibold">{c.procedimento} {c.sessao ? `(${c.sessao})` : ''}</p>
                            </div>

                            <div className="text-right">
                              <span className="font-extrabold text-slate-900 text-sm block">
                                R$ {Number(c.valor || 0).toFixed(2)}
                              </span>
                              <span className={`px-2 py-0.5 text-[9px] font-bold rounded-lg inline-block mt-1 ${
                                foiPago ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-900'
                              }`}>
                                {foiPago ? '✅ Recebido' : '⏳ A Receber'}
                              </span>
                            </div>
                          </div>

                          {!foiPago && (
                            <button 
                              onClick={() => handleConfirmarPagamento(c.id)}
                              className="w-full mt-2 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl shadow-sm flex items-center justify-center gap-1.5 active:scale-95 transition-all"
                            >
                              <IconCheck /> <span>Confirmar que o dinheiro entrou</span>
                            </button>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}

          </main>

          {/* POPUP ANIVERSARIANTES DO DIA */}
          {showPopupAniversario && aniversariantesHoje.length > 0 && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-md rounded-3xl p-6 space-y-4 shadow-2xl border border-rose-100 text-center">
                <div className="w-16 h-16 bg-rose-100 text-rose-900 rounded-full flex items-center justify-center text-3xl mx-auto shadow-inner">
                  🎉
                </div>

                <div>
                  <span className="text-[10px] uppercase tracking-widest font-bold text-rose-800 bg-rose-50 px-3 py-1 rounded-full">
                    Aniversariante(s) do Dia!
                  </span>
                  <h3 className="text-base font-extrabold text-slate-800 mt-2">
                    {aniversariantesHoje.length === 1 
                      ? "Hoje temos paciente de aniversário!" 
                      : "Hoje temos pacientes fazendo aniversário!"}
                  </h3>
                </div>

                <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100 space-y-2 text-left max-h-48 overflow-y-auto">
                  {aniversariantesHoje.map(p => (
                    <div key={p.id} className="flex justify-between items-center border-b border-slate-200/60 pb-2 last:border-0 last:pb-0">
                      <div>
                        <p className="text-xs font-bold text-slate-800">{p.nome}</p>
                        <p className="text-[10px] text-slate-500">📞 {p.telefone || 'Sem telefone'}</p>
                      </div>
                      <span className="text-xs font-extrabold text-rose-900 bg-rose-100 px-2.5 py-1 rounded-xl">
                        🎂 Aniversário Hoje
                      </span>
                    </div>
                  ))}
                </div>

                <div className="space-y-2 pt-2">
                  <button 
                    onClick={() => handleFecharPopupAniversario(false)} 
                    className="w-full p-3 bg-rose-900 text-white font-bold rounded-2xl text-xs shadow-md active:scale-95 transition-all"
                  >
                    Entendido / Fechar
                  </button>
                  <button 
                    onClick={() => handleFecharPopupAniversario(true)} 
                    className="w-full p-2.5 text-slate-400 hover:text-slate-600 font-bold text-[11px]"
                  >
                    Não mostrar novamente hoje
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL PREENCHER FICHA DE ANAMNESE DIGITAL */}
          {showNovaFicha && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-4">
              <div className="bg-white w-full max-w-md rounded-3xl p-5 space-y-3 max-h-[90vh] overflow-y-auto">
                <h3 className="text-sm font-bold text-slate-800 uppercase tracking-wider">Ficha de Anamnese Digital</h3>
                <p className="text-[10px] text-slate-400">Preenchimento pela Dra. Isabella para {selectedPaciente?.nome}</p>

                <form onSubmit={handleSalvarFicha} className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold text-slate-600 block mb-1">Tipo de Ficha / Procedimento *</label>
                    <select 
                      className="w-full p-3 bg-slate-50 border rounded-2xl font-bold text-rose-900"
                      value={formFicha.tipo_ficha}
                      onChange={e => {
                        const novoTipo = e.target.value;
                        setFormFicha({
                          ...formFicha,
                          tipo_ficha: novoTipo,
                          respostas_especificas: {}
                        });
                      }}
                    >
                      {TIPOS_ANAMNESE.map(t => <option key={t} value={t}>{t}</option>)}
                    </select>
                  </div>

                  <div>
                    <label className="font-bold text-slate-600 block mb-1">Data da Avaliação *</label>
                    <input type="date" required className="w-full p-3 bg-slate-50 border rounded-2xl" value={formFicha.data} onChange={e => setFormFicha({...formFicha, data: e.target.value})} />
                  </div>

                  <div>
                    <label className="font-bold text-slate-600 block mb-1">Queixa Principal / Objetivo Geral</label>
                    <textarea placeholder="Ex: Queixa de marcas de expressão ou flacidez..." className="w-full p-3 bg-slate-50 border rounded-2xl h-16" value={formFicha.queixa_principal} onChange={e => setFormFicha({...formFicha, queixa_principal: e.target.value})} />
                  </div>

                  {/* CAMPOS DINÂMICOS */}
                  {questoesAtuais.length > 0 && (
                    <div className="p-3 bg-rose-50/50 border border-rose-100 rounded-2xl space-y-3">
                      <p className="text-[10px] font-extrabold uppercase tracking-wider text-rose-900">Perguntas Específicas: {formFicha.tipo_ficha}</p>

                      {questoesAtuais.map(q => (
                        <div key={q.id}>
                          <label className="font-bold text-slate-700 block mb-1">{q.label}</label>
                          {q.type === 'select' ? (
                            <select 
                              className="w-full p-2.5 bg-white border rounded-xl text-xs font-medium"
                              value={formFicha.respostas_especificas[q.id] || q.options[0]}
                              onChange={e => setFormFicha({
                                ...formFicha,
                                respostas_especificas: {
                                  ...formFicha.respostas_especificas,
                                  [q.id]: e.target.value
                                }
                              })}
                            >
                              {q.options.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                            </select>
                          ) : (
                            <input 
                              type="text"
                              placeholder={q.placeholder || ''}
                              className="w-full p-2.5 bg-white border rounded-xl text-xs"
                              value={formFicha.respostas_especificas[q.id] || ''}
                              onChange={e => setFormFicha({
                                ...formFicha,
                                respostas_especificas: {
                                  ...formFicha.respostas_especificas,
                                  [q.id]: e.target.value
                                }
                              })}
                            />
                          )}
                        </div>
                      ))}
                    </div>
                  )}

                  <div>
                    <label className="font-bold text-slate-600 block mb-1">Avaliação Técnica & Conduta Médica</label>
                    <textarea placeholder="Ex: Aplicação realizada, dosagem, condutas pós-procedimento..." className="w-full p-3 bg-slate-50 border rounded-2xl h-20" value={formFicha.avaliacao_medica} onChange={e => setFormFicha({...formFicha, avaliacao_medica: e.target.value})} />
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button type="button" onClick={() => setShowNovaFicha(false)} className="w-1/2 p-3 bg-slate-100 font-bold rounded-2xl text-slate-600">Cancelar</button>
                    <button type="submit" className="w-1/2 p-3 bg-rose-900 font-bold text-white rounded-2xl">Salvar Ficha</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL VER FICHA PREENCHIDA */}
          {selectedFichaVer && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-4">
              <div className="bg-white w-full max-w-md rounded-3xl p-5 space-y-3 max-h-[90vh] overflow-y-auto">
                <span className="text-[10px] font-bold px-2.5 py-1 bg-rose-100 text-rose-900 rounded-xl block w-fit">
                  {selectedFichaVer.tipo_ficha}
                </span>
                <h3 className="text-sm font-bold text-slate-800">Ficha de {selectedPaciente?.nome}</h3>
                <p className="text-xs text-slate-400">Data: {new Date(selectedFichaVer.data + 'T00:00:00').toLocaleDateString('pt-BR')}</p>

                <div className="space-y-2.5 text-xs pt-2">
                  <div className="bg-slate-50 p-3 rounded-2xl border">
                    <strong className="text-slate-700 block mb-0.5">Queixa Principal / Objetivo:</strong>
                    <p className="text-slate-600">{selectedFichaVer.queixa_principal || 'Não informada'}</p>
                  </div>

                  {selectedFichaVer.respostas_especificas && Object.keys(selectedFichaVer.respostas_especificas).length > 0 && (
                    <div className="bg-rose-50/40 p-3 rounded-2xl border border-rose-100 space-y-2">
                      <strong className="text-rose-950 block mb-1 font-extrabold uppercase text-[10px]">Perguntas do Procedimento:</strong>
                      {Object.entries(selectedFichaVer.respostas_especificas).map(([key, val]) => (
                        <div key={key} className="border-b border-rose-100/60 pb-1.5 last:border-0 last:pb-0">
                          <span className="text-[11px] font-bold text-slate-700 capitalize block">{key.replace(/_/g, ' ')}:</span>
                          <span className="text-slate-600 text-xs">{val || 'Não informado'}</span>
                        </div>
                      ))}
                    </div>
                  )}

                  <div className="bg-rose-50/60 p-3 rounded-2xl border border-rose-100">
                    <strong className="text-rose-950 block mb-0.5">Avaliação Técnica & Conduta Médica:</strong>
                    <p className="text-rose-900">{selectedFichaVer.avaliacao_medica || 'Sem anotações adicionais'}</p>
                  </div>
                </div>

                <div className="pt-2">
                  <button type="button" onClick={() => setSelectedFichaVer(null)} className="w-full p-3 bg-slate-900 text-white font-bold rounded-2xl text-xs">
                    Fechar
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL CADASTRAR PACIENTE */}
          {showNovoPaciente && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-4">
              <div className="bg-white w-full max-w-md rounded-3xl p-5 space-y-3">
                <h3 className="text-sm font-bold text-slate-800 uppercase tracking-wider">Cadastrar Paciente</h3>
                <form onSubmit={handleAddPaciente} className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold text-slate-600 block mb-0.5">Nome Completo *</label>
                    <input required placeholder="Nome Completo *" className="w-full p-3 bg-slate-50 border rounded-2xl" value={formPaciente.nome} onChange={e => setFormPaciente({...formPaciente, nome: e.target.value})} />
                  </div>

                  <div>
                    <label className="font-bold text-slate-600 block mb-0.5">Telefone / WhatsApp *</label>
                    <input required placeholder="Telefone / WhatsApp *" className="w-full p-3 bg-slate-50 border rounded-2xl" value={formPaciente.telefone} onChange={e => setFormPaciente({...formPaciente, telefone: e.target.value})} />
                  </div>

                  <div>
                    <label className="font-bold text-slate-600 block mb-0.5">Data de Nascimento</label>
                    <input type="date" className="w-full p-3 bg-slate-50 border rounded-2xl" value={formPaciente.data_nascimento} onChange={e => setFormPaciente({...formPaciente, data_nascimento: e.target.value})} />
                  </div>

                  <div>
                    <label className="font-bold text-slate-600 block mb-0.5">Observações Gerais</label>
                    <textarea placeholder="Observações sobre a paciente..." className="w-full p-3 bg-slate-50 border rounded-2xl h-14" value={formPaciente.observacoes} onChange={e => setFormPaciente({...formPaciente, observacoes: e.target.value})} />
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button type="button" onClick={() => setShowNovoPaciente(false)} className="w-1/2 p-3 bg-slate-100 font-bold rounded-2xl text-slate-600">Cancelar</button>
                    <button type="submit" className="w-1/2 p-3 bg-rose-900 font-bold text-white rounded-2xl">Salvar Paciente</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL EDITAR PACIENTE */}
          {showEditarPaciente && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-4">
              <div className="bg-white w-full max-w-md rounded-3xl p-5 space-y-3">
                <h3 className="text-sm font-bold text-slate-800 uppercase tracking-wider">Editar Dados da Paciente</h3>
                <form onSubmit={handleSalvarEdicao} className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold text-slate-600 block mb-1">Nome Completo *</label>
                    <input required className="w-full p-3 bg-slate-50 border rounded-2xl" value={formPaciente.nome} onChange={e => setFormPaciente({...formPaciente, nome: e.target.value})} />
                  </div>
                  <div>
                    <label className="font-bold text-slate-600 block mb-1">Telefone / WhatsApp *</label>
                    <input required className="w-full p-3 bg-slate-50 border rounded-2xl" value={formPaciente.telefone} onChange={e => setFormPaciente({...formPaciente, telefone: e.target.value})} />
                  </div>
                  <div>
                    <label className="font-bold text-slate-600 block mb-1">Data de Nascimento</label>
                    <input type="date" className="w-full p-3 bg-slate-50 border rounded-2xl" value={formPaciente.data_nascimento} onChange={e => setFormPaciente({...formPaciente, data_nascimento: e.target.value})} />
                  </div>
                  <div>
                    <label className="font-bold text-slate-600 block mb-1">Observações Gerais</label>
                    <textarea className="w-full p-3 bg-slate-50 border rounded-2xl h-14" value={formPaciente.observacoes} onChange={e => setFormPaciente({...formPaciente, observacoes: e.target.value})} />
                  </div>
                  <div className="flex gap-2 pt-2">
                    <button type="button" onClick={() => setShowEditarPaciente(false)} className="w-1/2 p-3 bg-slate-100 font-bold rounded-2xl text-slate-600">Cancelar</button>
                    <button type="submit" className="w-1/2 p-3 bg-rose-900 font-bold text-white rounded-2xl">Salvar Edição</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL AGENDAR CONSULTA */}
          {showNovaConsulta && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-4">
              <div className="bg-white w-full max-w-md rounded-3xl p-5 space-y-3 max-h-[90vh] overflow-y-auto">
                <h3 className="text-sm font-bold text-slate-800 uppercase tracking-wider">Incluir Agendamento</h3>
                <form onSubmit={handleAddConsulta} className="space-y-3 text-xs">
                  <div>
                    <div className="flex justify-between items-center mb-1">
                      <label className="font-bold text-slate-600 block">Paciente *</label>
                      <button 
                        type="button" 
                        onClick={() => setModoPacienteManual(!modoPacienteManual)} 
                        className="text-[10px] text-rose-800 font-bold underline"
                      >
                        {modoPacienteManual ? "‹ Escolher da lista" : "+ Digitar novo nome"}
                      </button>
                    </div>

                    {!modoPacienteManual && pacientes.length > 0 ? (
                      <select 
                        required 
                        className="w-full p-3 bg-slate-50 border rounded-2xl font-medium"
                        value={formConsulta.paciente_id}
                        onChange={handlePacienteSelect}
                      >
                        <option value="">-- Selecione a Paciente --</option>
                        {pacientes.map(p => (
                          <option key={p.id} value={p.id}>{p.nome}</option>
                        ))}
                      </select>
                    ) : (
                      <input 
                        required 
                        placeholder="Digite o nome completo da paciente *" 
                        className="w-full p-3 bg-slate-50 border rounded-2xl" 
                        value={formConsulta.paciente_nome} 
                        onChange={e => setFormConsulta({...formConsulta, paciente_nome: e.target.value, paciente_id: ''})} 
                      />
                    )}
                  </div>

                  <div>
                    <label className="font-bold text-slate-600 block mb-1">Procedimento *</label>
                    <select 
                      className="w-full p-3 bg-slate-50 border rounded-2xl"
                      value={formConsulta.procedimento}
                      onChange={e => handleProcedimentoChange(e.target.value)}
                    >
                      {PROCEDIMENTOS_PRESET.map(proc => (
                        <option key={proc.nome} value={proc.nome}>{proc.nome}</option>
                      ))}
                    </select>
                  </div>

                  {formConsulta.procedimento === "Outro Procedimento..." && (
                    <input 
                      required 
                      placeholder="Nome do Procedimento Personalizado *" 
                      className="w-full p-3 bg-slate-50 border rounded-2xl" 
                      value={formConsulta.procedimento_custom} 
                      onChange={e => setFormConsulta({...formConsulta, procedimento_custom: e.target.value})} 
                    />
                  )}

                  <div>
                    <label className="font-bold text-slate-600 block mb-1">Sessão</label>
                    <select 
                      className="w-full p-3 bg-slate-50 border rounded-2xl font-bold text-slate-800"
                      value={formConsulta.sessao}
                      onChange={e => setFormConsulta({...formConsulta, sessao: e.target.value})}
                    >
                      {OPCOES_SESSAO.map(s => <option key={s} value={s}>{s}</option>)}
                    </select>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-bold text-slate-600 block mb-1">Data *</label>
                      <input type="date" required className="w-full p-3 bg-slate-50 border rounded-2xl" value={formConsulta.data} onChange={e => setFormConsulta({...formConsulta, data: e.target.value})} />
                    </div>
                    <div>
                      <label className="font-bold text-slate-600 block mb-1">Horário *</label>
                      <input type="time" required className="w-full p-3 bg-slate-50 border rounded-2xl" value={formConsulta.hora} onChange={e => setFormConsulta({...formConsulta, hora: e.target.value})} />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-bold text-slate-600 block mb-1">Valor (R$)</label>
                      <input type="number" placeholder="Ex: 350" className="w-full p-3 bg-slate-50 border rounded-2xl" value={formConsulta.valor} onChange={e => setFormConsulta({...formConsulta, valor: e.target.value})} />
                    </div>
                    <div>
                      <label className="font-bold text-slate-600 block mb-1">Status Pagamento</label>
                      <select 
                        className="w-full p-3 bg-slate-50 border rounded-2xl font-bold text-slate-800"
                        value={formConsulta.status_pagamento}
                        onChange={e => setFormConsulta({...formConsulta, status_pagamento: e.target.value})}
                      >
                        <option value="Pendente">⏳ Pendente</option>
                        <option value="Recebido">✅ Recebido</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="font-bold text-slate-600 block mb-1">Observação (Opcional)</label>
                    <textarea 
                      placeholder="Notas ou detalhes adicionais sobre o agendamento..." 
                      className="w-full p-3 bg-slate-50 border rounded-2xl h-16" 
                      value={formConsulta.observacoes} 
                      onChange={e => setFormConsulta({...formConsulta, observacoes: e.target.value})} 
                    />
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button type="button" onClick={() => setShowNovaConsulta(false)} className="w-1/2 p-3 bg-slate-100 font-bold rounded-2xl text-slate-600">Cancelar</button>
                    <button type="submit" className="w-1/2 p-3 bg-rose-900 font-bold text-white rounded-2xl">Confirmar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL EDITAR CONSULTA */}
          {showEditarConsulta && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-4">
              <div className="bg-white w-full max-w-md rounded-3xl p-5 space-y-3 max-h-[90vh] overflow-y-auto">
                <h3 className="text-sm font-bold text-slate-800 uppercase tracking-wider">Editar Agendamento</h3>
                <form onSubmit={handleSalvarEdicaoConsulta} className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold text-slate-600 block mb-1">Paciente</label>
                    <input required className="w-full p-3 bg-slate-50 border rounded-2xl" value={formConsulta.paciente_nome} onChange={e => setFormConsulta({...formConsulta, paciente_nome: e.target.value})} />
                  </div>

                  <div>
                    <label className="font-bold text-slate-600 block mb-1">Procedimento</label>
                    <select 
                      className="w-full p-3 bg-slate-50 border rounded-2xl"
                      value={formConsulta.procedimento}
                      onChange={e => handleProcedimentoChange(e.target.value)}
                    >
                      {PROCEDIMENTOS_PRESET.map(proc => (
                        <option key={proc.nome} value={proc.nome}>{proc.nome}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="font-bold text-slate-600 block mb-1">Sessão</label>
                    <select 
                      className="w-full p-3 bg-slate-50 border rounded-2xl font-bold text-slate-800"
                      value={formConsulta.sessao}
                      onChange={e => setFormConsulta({...formConsulta, sessao: e.target.value})}
                    >
                      {OPCOES_SESSAO.map(s => <option key={s} value={s}>{s}</option>)}
                    </select>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-bold text-slate-600 block mb-1">Data</label>
                      <input type="date" required className="w-full p-3 bg-slate-50 border rounded-2xl" value={formConsulta.data} onChange={e => setFormConsulta({...formConsulta, data: e.target.value})} />
                    </div>
                    <div>
                      <label className="font-bold text-slate-600 block mb-1">Horário</label>
