<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dra. Isabella Duarte - Estética Avançada</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React e React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Fontes Google -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      -webkit-tap-highlight-color: transparent;
      background-color: #faf7f8;
    }
    .glass-nav {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="text-slate-800 pb-24">

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // Ícones SVG Minimalistas
    const IconHome = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>;
    const IconUsers = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>;
    const IconCalendar = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>;
    const IconDollar = () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>;
    const IconPlus = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>;
    const IconSearch = () => <svg className="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>;
    const IconAlert = () => <svg className="w-4 h-4 text-rose-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>;
    const IconEdit = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>;
    const IconTrash = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>;
    const IconCamera = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>;

    // Dados Iniciais de Exemplo
    const INITIAL_PACIENTES = [
      { 
        id: '1', 
        nome: 'Ana Paula Silva', 
        telefone: '(11) 98765-4321', 
        cpf: '123.456.789-00', 
        alergias: ['Lidocaína', 'Látex'], 
        tipoPele: 'Sensível / Mista', 
        observacoes: 'Sensibilidade a ácidos concentrados.',
        documentos: [
          { id: 'd1', titulo: 'Antes - Toxina Botulínica', data: '12/09/2026', url: 'https://images.unsplash.com/photo-1512290900673-030999059535?auto=format&fit=crop&w=300&q=80', tipo: 'imagem' }
        ]
      },
      { 
        id: '2', 
        nome: 'Mariana Costa', 
        telefone: '(11) 91234-5678', 
        cpf: '987.654.321-11', 
        alergias: ['Ácido Glicólico'], 
        tipoPele: 'Oleosa', 
        observacoes: 'Horário preferencial à tarde.',
        documentos: []
      }
    ];

    const INITIAL_CONSULTAS = [
      { id: '101', paciente: 'Ana Paula Silva', procedimento: 'Botox - Terço Superior', hora: '14:00', valor: 1350 },
      { id: '102', paciente: 'Mariana Costa', procedimento: 'Preenchimento Labial 1ml', hora: '15:30', valor: 1600 }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [pacientes, setPacientes] = useState(INITIAL_PACIENTES);
      const [consultas, setConsultas] = useState(INITIAL_CONSULTAS);
      const [busca, setBusca] = useState('');
      const [selectedPaciente, setSelectedPaciente] = useState(null);

      // Modais
      const [showNovoPaciente, setShowNovoPaciente] = useState(false);
      const [showEditarPaciente, setShowEditarPaciente] = useState(false);
      const [showNovaConsulta, setShowNovaConsulta] = useState(false);
      const [showNovoDoc, setShowNovoDoc] = useState(false);

      // Formulários
      const [formPaciente, setFormPaciente] = useState({ nome: '', telefone: '', cpf: '', tipoPele: 'Mista', observacoes: '' });
      const [formDoc, setFormDoc] = useState({ titulo: '', arquivo: null, previewUrl: '' });
      const [formConsulta, setFormConsulta] = useState({ paciente: '', procedimento: '', hora: '14:00', valor: '' });

      const pacientesFiltrados = pacientes.filter(p => 
        p.nome.toLowerCase().includes(busca.toLowerCase()) || p.telefone.includes(busca)
      );

      const totalFaturamento = consultas.reduce((acc, c) => acc + Number(c.valor || 0), 0);

      // 1. Cadastrar Paciente
      function handleAddPaciente(e) {
        e.preventDefault();
        if (!formPaciente.nome) return;
        const novo = { id: Date.now().toString(), ...formPaciente, alergias: [], documentos: [] };
        setPacientes([...pacientes, novo]);
        setFormPaciente({ nome: '', telefone: '', cpf: '', tipoPele: 'Mista', observacoes: '' });
        setShowNovoPaciente(false);
      }

      // 2. Abrir Edição
      function handleAbrirEditar(paciente) {
        setFormPaciente({
          nome: paciente.nome,
          telefone: paciente.telefone || '',
          cpf: paciente.cpf || '',
          tipoPele: paciente.tipoPele || 'Mista',
          observacoes: paciente.observacoes || ''
        });
        setShowEditarPaciente(true);
      }

      // 3. Salvar Edição
      function handleSalvarEdicao(e) {
        e.preventDefault();
        const atualizados = pacientes.map(p => {
          if (p.id === selectedPaciente.id) {
            return { ...p, ...formPaciente };
          }
          return p;
        });
        setPacientes(atualizados);
        setSelectedPaciente({ ...selectedPaciente, ...formPaciente });
        setShowEditarPaciente(false);
      }

      // 4. Excluir Paciente
      function handleExcluirPaciente(id) {
        if (confirm("Tem certeza que deseja excluir esta paciente? Esta ação não pode ser desfeita.")) {
          setPacientes(pacientes.filter(p => p.id !== id));
          setSelectedPaciente(null);
        }
      }

      // 5. Upload/Adicionar Documento ou Foto
      function handleFileChange(e) {
        const file = e.target.files[0];
        if (file) {
          const url = URL.createObjectURL(file);
          setFormDoc({ ...formDoc, arquivo: file, previewUrl: url });
        }
      }

      function handleAddDocumento(e) {
        e.preventDefault();
        if (!formDoc.titulo || !formDoc.previewUrl) return alert("Selecione um arquivo e informe o título.");

        const novoDoc = {
          id: Date.now().toString(),
          titulo: formDoc.titulo,
          data: new Date().toLocaleDateString('pt-BR'),
          url: formDoc.previewUrl,
          tipo: formDoc.arquivo?.type.includes('image') ? 'imagem' : 'documento'
        };

        const pacientesAtualizados = pacientes.map(p => {
          if (p.id === selectedPaciente.id) {
            return { ...p, documentos: [...(p.documentos || []), novoDoc] };
          }
          return p;
        });

        setPacientes(pacientesAtualizados);
        setSelectedPaciente({ ...selectedPaciente, documentos: [...(selectedPaciente.documentos || []), novoDoc] });
        setFormDoc({ titulo: '', arquivo: null, previewUrl: '' });
        setShowNovoDoc(false);
      }

      // 6. Excluir Foto/Documento
      function handleExcluirDoc(docId) {
        if (confirm("Deseja remover este documento?")) {
          const novosDocs = (selectedPaciente.documentos || []).filter(d => d.id !== docId);
          const pacientesAtualizados = pacientes.map(p => {
            if (p.id === selectedPaciente.id) return { ...p, documentos: novosDocs };
            return p;
          });
          setPacientes(pacientesAtualizados);
          setSelectedPaciente({ ...selectedPaciente, documentos: novosDocs });
        }
      }

      // 7. Adicionar Consulta
      function handleAddConsulta(e) {
        e.preventDefault();
        if (!formConsulta.procedimento) return;
        setConsultas([...consultas, { id: Date.now().toString(), ...formConsulta }]);
        setFormConsulta({ paciente: '', procedimento: '', hora: '14:00', valor: '' });
        setShowNovaConsulta(false);
      }

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col bg-[#faf7f8]">
          
          {/* Top Header Luxo */}
          <header className="bg-gradient-to-r from-rose-950 via-rose-900 to-rose-950 text-white p-5 rounded-b-3xl shadow-lg flex justify-between items-center sticky top-0 z-20 border-b border-rose-800/40">
            <div>
              <span className="text-[10px] uppercase tracking-widest text-rose-300 font-bold block">Clínica Médica</span>
              <h1 className="text-lg font-bold tracking-tight text-rose-50">Dra. Isabella Duarte</h1>
            </div>
            <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-rose-700 to-rose-900 border border-rose-500/30 flex items-center justify-center font-extrabold text-xs text-rose-100 shadow-inner">
              ID
            </div>
          </header>

          {/* Conteúdo Principal */}
          <main className="flex-1 p-4 space-y-4">

            {/* DASHBOARD */}
            {activeTab === 'dashboard' && (
              <div className="space-y-4">
                <div className="bg-gradient-to-br from-rose-900 via-rose-800 to-rose-950 text-white p-5 rounded-3xl shadow-md">
                  <p className="text-[11px] text-rose-200 uppercase tracking-widest font-semibold">Resumo do Dia</p>
                  <h2 className="text-2xl font-extrabold mt-0.5 text-white">Hoje</h2>
                  <div className="grid grid-cols-2 gap-3 mt-4">
                    <div className="bg-white/10 backdrop-blur-md p-3.5 rounded-2xl border border-white/10">
                      <p className="text-[11px] text-rose-200">Consultas</p>
                      <p className="text-2xl font-black mt-0.5">{consultas.length}</p>
                    </div>
                    <div className="bg-white/10 backdrop-blur-md p-3.5 rounded-2xl border border-white/10">
                      <p className="text-[11px] text-rose-200">Pacientes</p>
                      <p className="text-2xl font-black mt-0.5">{pacientes.length}</p>
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <button onClick={() => setShowNovoPaciente(true)} className="p-4 bg-white border border-rose-100 rounded-2xl shadow-sm text-left flex items-center justify-between active:scale-95 transition-all">
                    <div>
                      <p className="text-xs font-bold text-slate-800">+ Paciente</p>
                      <p className="text-[10px] text-slate-400 mt-0.5">Novo cadastro</p>
                    </div>
                    <div className="w-8 h-8 rounded-xl bg-rose-50 text-rose-700 flex items-center justify-center"><IconUsers /></div>
                  </button>

                  <button onClick={() => setShowNovaConsulta(true)} className="p-4 bg-white border border-rose-100 rounded-2xl shadow-sm text-left flex items-center justify-between active:scale-95 transition-all">
                    <div>
                      <p className="text-xs font-bold text-slate-800">+ Agendar</p>
                      <p className="text-[10px] text-slate-400 mt-0.5">Nova consulta</p>
                    </div>
                    <div className="w-8 h-8 rounded-xl bg-rose-50 text-rose-700 flex items-center justify-center"><IconCalendar /></div>
                  </button>
                </div>
              </div>
            )}

            {/* PACIENTES */}
            {activeTab === 'pacientes' && !selectedPaciente && (
              <div className="space-y-3">
                <div className="flex justify-between items-center">
                  <h2 className="text-sm font-bold text-slate-800 uppercase tracking-wider">Prontuário de Pacientes</h2>
                  <button onClick={() => setShowNovoPaciente(true)} className="px-3 py-1.5 bg-rose-900 text-white rounded-xl text-xs font-bold flex items-center gap-1 shadow-sm active:scale-95">
                    <IconPlus /> <span>Cadastrar</span>
                  </button>
                </div>

                <div className="relative">
                  <div className="absolute inset-y-0 left-3 flex items-center pointer-events-none"><IconSearch /></div>
                  <input 
                    type="text" 
                    placeholder="Buscar por nome ou telefone..." 
                    className="w-full pl-9 pr-4 py-2.5 bg-white border border-slate-200 rounded-2xl text-xs focus:outline-none focus:ring-2 focus:ring-rose-500/20"
                    value={busca}
                    onChange={e => setBusca(e.target.value)}
                  />
                </div>

                <div className="space-y-2">
                  {pacientesFiltrados.map(p => (
                    <div 
                      key={p.id} 
                      onClick={() => setSelectedPaciente(p)}
                      className="p-3.5 bg-white border border-slate-100 rounded-2xl shadow-sm flex items-center justify-between active:bg-rose-50/50 transition-colors cursor-pointer"
                    >
                      <div className="space-y-1">
                        <p className="font-bold text-slate-800 text-xs">{p.nome}</p>
                        <p className="text-[11px] text-slate-400">{p.telefone}</p>
                      </div>
                      <span className="text-slate-300 text-base font-bold">›</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* PERFIL DO PACIENTE */}
            {selectedPaciente && (
              <div className="space-y-4">
                
                {/* Botão Voltar & Ações Rápidas */}
                <div className="flex justify-between items-center">
                  <button onClick={() => setSelectedPaciente(null)} className="text-xs text-rose-800 font-bold flex items-center gap-1 bg-white px-3 py-1.5 rounded-xl border border-slate-200 shadow-sm">
                    ‹ Voltar para Lista
                  </button>

                  <div className="flex items-center gap-2">
                    <button onClick={() => handleAbrirEditar(selectedPaciente)} className="p-2 bg-amber-50 text-amber-800 rounded-xl border border-amber-200 font-bold text-xs flex items-center gap-1">
                      <IconEdit /> <span>Editar</span>
                    </button>
                    <button onClick={() => handleExcluirPaciente(selectedPaciente.id)} className="p-2 bg-rose-50 text-rose-800 rounded-xl border border-rose-200 font-bold text-xs flex items-center gap-1">
                      <IconTrash />
                    </button>
                  </div>
                </div>

                {/* Card do Paciente */}
                <div className="bg-white p-4 rounded-3xl shadow-sm border border-slate-100 space-y-3">
                  <div className="flex justify-between items-start">
                    <div>
                      <h2 className="text-base font-extrabold text-slate-800">{selectedPaciente.nome}</h2>
                      <p className="text-xs text-slate-400 mt-0.5">Tel: {selectedPaciente.telefone || 'Não informado'}</p>
                      <p className="text-xs text-slate-400">CPF: {selectedPaciente.cpf || 'Não informado'}</p>
                    </div>
                    <span className="px-2.5 py-1 bg-rose-50 text-rose-800 text-[10px] font-bold rounded-xl border border-rose-100">
                      Pele {selectedPaciente.tipoPele}
                    </span>
                  </div>

                  {selectedPaciente.observacoes && (
                    <p className="text-xs text-slate-600 bg-slate-50 p-3 rounded-2xl border border-slate-100">
                      <strong>Observações:</strong> {selectedPaciente.observacoes}
                    </p>
                  )}
                </div>

                {/* GALERIA DE FOTOS / DOCUMENTOS */}
                <div className="bg-white p-4 rounded-3xl shadow-sm border border-slate-100 space-y-3">
                  <div className="flex justify-between items-center">
                    <div>
                      <h3 className="text-xs font-bold text-slate-800 uppercase tracking-wider">Fotos & Documentos</h3>
                      <p className="text-[10px] text-slate-400">Fotos de Antes/Depois e arquivos</p>
                    </div>
                    <button onClick={() => setShowNovoDoc(true)} className="px-3 py-1.5 bg-rose-900 text-white text-xs font-bold rounded-xl flex items-center gap-1 shadow-sm">
                      <IconCamera /> <span>Anexar</span>
                    </button>
                  </div>

                  {(!selectedPaciente.documentos || selectedPaciente.documentos.length === 0) ? (
                    <div className="text-center py-6 border border-dashed border-slate-200 rounded-2xl bg-slate-50/50">
                      <p className="text-xs text-slate-400">Nenhuma foto ou documento anexado.</p>
                    </div>
                  ) : (
                    <div className="grid grid-cols-2 gap-3">
                      {selectedPaciente.documentos.map(doc => (
                        <div key={doc.id} className="relative bg-slate-50 border border-slate-200 rounded-2xl overflow-hidden p-2">
                          {doc.tipo === 'imagem' ? (
                            <img src={doc.url} alt={doc.titulo} className="w-full h-28 object-cover rounded-xl" />
                          ) : (
                            <div className="w-full h-28 bg-rose-50 rounded-xl flex items-center justify-center text-rose-800 font-bold text-xs">
                              📄 Ficheiro
                            </div>
                          )}
                          <div className="mt-2 flex justify-between items-center px-1">
                            <div>
                              <p className="text-[10px] font-bold text-slate-800 truncate max-w-[100px]">{doc.titulo}</p>
                              <p className="text-[9px] text-slate-400">{doc.data}</p>
                            </div>
                            <button onClick={() => handleExcluirDoc(doc.id)} className="text-rose-600 p-1">
                              <IconTrash />
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

              </div>
            )}

            {/* AGENDA */}
            {activeTab === 'agenda' && (
              <div className="space-y-3">
                <h2 className="text-sm font-bold text-slate-800 uppercase tracking-wider">Agenda de Atendimentos</h2>
                <div className="space-y-2">
                  {consultas.map(c => (
                    <div key={c.id} className="p-3.5 bg-white rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between text-xs">
                      <div>
                        <p className="font-bold text-slate-800">{c.paciente}</p>
                        <p className="text-slate-500">{c.procedimento}</p>
                      </div>
                      <span className="font-bold text-rose-900">R$ {Number(c.valor).toFixed(2)}</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* FINANCEIRO */}
            {activeTab === 'financeiro' && (
              <div className="space-y-3">
                <h2 className="text-sm font-bold text-slate-800 uppercase tracking-wider">Fluxo Financeiro</h2>
                <div className="bg-gradient-to-br from-emerald-800 to-emerald-950 text-white p-5 rounded-3xl shadow-md">
                  <p className="text-[11px] text-emerald-200">Faturamento Total</p>
                  <p className="text-3xl font-black mt-1">R$ {totalFaturamento.toFixed(2)}</p>
                </div>
              </div>
            )}

          </main>

          {/* MODAL CADASTRAR PACIENTE */}
          {showNovoPaciente && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-4">
              <div className="bg-white w-full max-w-md rounded-3xl p-5 space-y-4">
                <h3 className="text-sm font-bold text-slate-800 uppercase tracking-wider">Cadastrar Paciente</h3>
                <form onSubmit={handleAddPaciente} className="space-y-3 text-xs">
                  <input required placeholder="Nome Completo *" className="w-full p-3 bg-slate-50 border rounded-2xl" value={formPaciente.nome} onChange={e => setFormPaciente({...formPaciente, nome: e.target.value})} />
                  <input placeholder="Telefone / WhatsApp" className="w-full p-3 bg-slate-50 border rounded-2xl" value={formPaciente.telefone} onChange={e => setFormPaciente({...formPaciente, telefone: e.target.value})} />
                  <input placeholder="CPF" className="w-full p-3 bg-slate-50 border rounded-2xl" value={formPaciente.cpf} onChange={e => setFormPaciente({...formPaciente, cpf: e.target.value})} />
                  <div className="flex gap-2 pt-2">
                    <button type="button" onClick={() => setShowNovoPaciente(false)} className="w-1/2 p-3 bg-slate-100 font-bold rounded-2xl text-slate-600">Cancelar</button>
                    <button type="submit" className="w-1/2 p-3 bg-rose-900 font-bold text-white rounded-2xl">Salvar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL EDITAR PACIENTE */}
          {showEditarPaciente && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-4">
              <div className="bg-white w-full max-w-md rounded-3xl p-5 space-y-4">
                <h3 className="text-sm font-bold text-slate-800 uppercase tracking-wider">Editar Dados da Paciente</h3>
                <form onSubmit={handleSalvarEdicao} className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold text-slate-600 block mb-1">Nome Completo</label>
                    <input required className="w-full p-3 bg-slate-50 border rounded-2xl" value={formPaciente.nome} onChange={e => setFormPaciente({...formPaciente, nome: e.target.value})} />
                  </div>
                  <div>
                    <label className="font-bold text-slate-600 block mb-1">Telefone</label>
                    <input className="w-full p-3 bg-slate-50 border rounded-2xl" value={formPaciente.telefone} onChange={e => setFormPaciente({...formPaciente, telefone: e.target.value})} />
                  </div>
                  <div>
                    <label className="font-bold text-slate-600 block mb-1">Tipo de Pele</label>
                    <select className="w-full p-3 bg-slate-50 border rounded-2xl" value={formPaciente.tipoPele} onChange={e => setFormPaciente({...formPaciente, tipoPele: e.target.value})}>
                      <option>Normal</option>
                      <option>Seca</option>
                      <option>Oleosa</option>
                      <option>Mista</option>
                      <option>Sensível</option>
                    </select>
                  </div>
                  <div>
                    <label className="font-bold text-slate-600 block mb-1">Observações Gerais</label>
                    <textarea className="w-full p-3 bg-slate-50 border rounded-2xl h-16" value={formPaciente.observacoes} onChange={e => setFormPaciente({...formPaciente, observacoes: e.target.value})} />
                  </div>
                  <div className="flex gap-2 pt-2">
                    <button type="button" onClick={() => setShowEditarPaciente(false)} className="w-1/2 p-3 bg-slate-100 font-bold rounded-2xl text-slate-600">Cancelar</button>
                    <button type="submit" className="w-1/2 p-3 bg-rose-900 font-bold text-white rounded-2xl">Salvar Edição</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL ANEXAR FOTO / DOCUMENTO */}
          {showNovoDoc && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-4">
              <div className="bg-white w-full max-w-md rounded-3xl p-5 space-y-4">
                <h3 className="text-sm font-bold text-slate-800 uppercase tracking-wider">Anexar Foto ou Documento</h3>
                <form onSubmit={handleAddDocumento} className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold text-slate-600 block mb-1">Título / Descrição *</label>
                    <input required placeholder="Ex: Antes - Botox, Termo de Consentimento" className="w-full p-3 bg-slate-50 border rounded-2xl" value={formDoc.titulo} onChange={e => setFormDoc({...formDoc, titulo: e.target.value})} />
                  </div>
                  <div>
                    <label className="font-bold text-slate-600 block mb-1">Escolher Foto / Ficheiro *</label>
                    <input type="file" accept="image/*,.pdf" required onChange={handleFileChange} className="w-full p-2 text-xs text-slate-500 bg-slate-50 border rounded-2xl file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-rose-900 file:text-white" />
                  </div>

                  {formDoc.previewUrl && (
                    <div className="mt-2">
                      <p className="text-[10px] font-bold text-slate-500 mb-1">Pré-visualização:</p>
                      <img src={formDoc.previewUrl} className="w-full h-32 object-cover rounded-2xl border" />
                    </div>
                  )}

                  <div className="flex gap-2 pt-2">
                    <button type="button" onClick={() => setShowNovoDoc(false)} className="w-1/2 p-3 bg-slate-100 font-bold rounded-2xl text-slate-600">Cancelar</button>
                    <button type="submit" className="w-1/2 p-3 bg-rose-900 font-bold text-white rounded-2xl">Adicionar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL NOVA CONSULTA */}
          {showNovaConsulta && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-4">
              <div className="bg-white w-full max-w-md rounded-3xl p-5 space-y-4">
                <h3 className="text-sm font-bold text-slate-800 uppercase tracking-wider">Agendar Consulta</h3>
                <form onSubmit={handleAddConsulta} className="space-y-3 text-xs">
                  <input required placeholder="Nome do Paciente *" className="w-full p-3 bg-slate-50 border rounded-2xl" value={formConsulta.paciente} onChange={e => setFormConsulta({...formConsulta, paciente: e.target.value})} />
                  <input required placeholder="Procedimento *" className="w-full p-3 bg-slate-50 border rounded-2xl" value={formConsulta.procedimento} onChange={e => setFormConsulta({...formConsulta, procedimento: e.target.value})} />
                  <input type="number" placeholder="Valor (R$)" className="w-full p-3 bg-slate-50 border rounded-2xl" value={formConsulta.valor} onChange={e => setFormConsulta({...formConsulta, valor: e.target.value})} />
                  <div className="flex gap-2 pt-2">
                    <button type="button" onClick={() => setShowNovaConsulta(false)} className="w-1/2 p-3 bg-slate-100 font-bold rounded-2xl text-slate-600">Cancelar</button>
                    <button type="submit" className="w-1/2 p-3 bg-rose-900 font-bold text-white rounded-2xl">Confirmar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Menu Flutuante Inferior */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto glass-nav border-t border-slate-200/80 px-4 py-2 flex justify-around text-[10px] font-bold text-slate-400 z-20 shadow-2xl">
            <button onClick={() => { setActiveTab('dashboard'); setSelectedPaciente(null); }} className={`flex flex-col items-center gap-1 ${activeTab === 'dashboard' ? 'text-rose-900 font-black' : ''}`}>
              <IconHome /> <span>Início</span>
            </button>
            <button onClick={() => { setActiveTab('pacientes'); setSelectedPaciente(null); }} className={`flex flex-col items-center gap-1 ${activeTab === 'pacientes' ? 'text-rose-900 font-black' : ''}`}>
              <IconUsers /> <span>Pacientes</span>
            </button>
            <button onClick={() => { setActiveTab('agenda'); setSelectedPaciente(null); }} className={`flex flex-col items-center gap-1 ${activeTab === 'agenda' ? 'text-rose-900 font-black' : ''}`}>
              <IconCalendar /> <span>Agenda</span>
            </button>
            <button onClick={() => { setActiveTab('financeiro'); setSelectedPaciente(null); }} className={`flex flex-col items-center gap-1 ${activeTab === 'financeiro' ? 'text-rose-900 font-black' : ''}`}>
              <IconDollar /> <span>Financeiro</span>
            </button>
          </nav>

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
