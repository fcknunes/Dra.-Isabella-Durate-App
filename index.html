    // FUNÇÃO PARA GERAR FICHEIRO .ICS (iOS/Apple Calendar)
    function baixarEventoICS(consulta) {
      const dataHoraInicio = new Date(`${consulta.data}T${consulta.hora || '14:00'}:00`);
      let horasDuracao = 1;
      if (consulta.duracao && consulta.duracao.includes('2')) horasDuracao = 2;
      if (consulta.duracao && consulta.duracao.includes('3')) horasDuracao = 3;

      const dataHoraFim = new Date(dataHoraInicio.getTime() + horasDuracao * 60 * 60 * 1000);
      const formatarDataICS = (date) => date.toISOString().replace(/-|:|\.\d+/g, '');

      const conteudoICS = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//Dra Isabella Duarte//Estetica Avancada//PT',
        'BEGIN:VEVENT',
        `SUMMARY:Atendimento: ${consulta.paciente_nome} - ${consulta.procedimento}`,
        `DESCRIPTION:Procedimento: ${consulta.procedimento}\\nSessao: ${consulta.sessao || 'Unica'}\\nDuracao: ${consulta.duracao || '1 hora'}`,
        `DTSTART:${formatarDataICS(dataHoraInicio)}`,
        `DTEND:${formatarDataICS(dataHoraFim)}`,
        'END:VEVENT',
        'END:VCALENDAR'
      ].join('\r\n');

      const blob = new Blob([conteudoICS], { type: 'text/calendar;charset=utf-8' });
      const link = document.createElement('a');
      link.href = window.URL.createObjectURL(blob);
      link.setAttribute('download', `Agendamento_${(consulta.paciente_nome || 'Paciente').replace(/\s+/g, '_')}.ics`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // COMPONENTE DE CALENDÁRIO INTERATIVO
    function CalendarWidget({ dataFiltro, setDataFiltro, consultas }) {
      const [currentMonth, setCurrentMonth] = useState(() => {
        if (dataFiltro) {
          const parts = dataFiltro.split('-');
          if (parts.length === 3) return new Date(Number(parts[0]), Number(parts[1]) - 1, 1);
        }
        return new Date();
      });

      const diasComAgendamento = new Set(
        consultas
          .filter(c => c.status !== 'Cancelado')
          .map(c => c.data || (c.data_hora ? c.data_hora.split('T')[0] : ''))
          .filter(Boolean)
      );

      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth();
      const monthNames = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];

      const firstDayOfWeek = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const prevMonth = () => setCurrentMonth(new Date(year, month - 1, 1));
      const nextMonth = () => setCurrentMonth(new Date(year, month + 1, 1));

      const daysGrid = [];
      for (let i = 0; i < firstDayOfWeek; i++) daysGrid.push(null);
      for (let d = 1; d <= daysInMonth; d++) {
        const mm = String(month + 1).padStart(2, '0');
        const dd = String(d).padStart(2, '0');
        daysGrid.push({ day: d, dateStr: `${year}-${mm}-${dd}` });
      }

      return (
        <div className="bg-white/90 backdrop-blur-md p-4 rounded-3xl border border-slate-100 shadow-sm space-y-3">
          <div className="flex justify-between items-center px-1">
            <button type="button" onClick={prevMonth} className="w-8 h-8 rounded-xl bg-slate-100 hover:bg-rose-50 text-slate-700 font-bold text-sm flex items-center justify-center">‹</button>
            <span className="text-xs font-extrabold text-slate-800 uppercase tracking-wider">{monthNames[month]} {year}</span>
            <button type="button" onClick={nextMonth} className="w-8 h-8 rounded-xl bg-slate-100 hover:bg-rose-50 text-slate-700 font-bold text-sm flex items-center justify-center">›</button>
          </div>

          <div className="grid grid-cols-7 gap-1 text-center text-[10px] font-bold text-slate-400">
            <span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
          </div>

          <div className="grid grid-cols-7 gap-1">
            {daysGrid.map((item, idx) => {
              if (!item) return <div key={`empty-${idx}`} className="h-9" />;
              const isSelected = item.dateStr === dataFiltro;
              const temAgendamento = diasComAgendamento.has(item.dateStr);

              let bgStyle = "bg-slate-50/50 text-slate-700 hover:bg-rose-50";
              if (isSelected) bgStyle = "bg-rose-900 text-white font-black shadow-md scale-105 z-10";
              else if (temAgendamento) bgStyle = "bg-rose-100 text-rose-950 font-extrabold border border-rose-300 shadow-sm";

              return (
                <button
                  key={item.dateStr}
                  type="button"
                  onClick={() => setDataFiltro(item.dateStr)}
                  className={`h-9 rounded-2xl flex flex-col items-center justify-center text-xs relative transition-all active:scale-95 ${bgStyle}`}
                >
                  <span>{item.day}</span>
                  {temAgendamento && !isSelected && <span className="w-1.5 h-1.5 bg-rose-600 rounded-full absolute bottom-1"></span>}
                  {temAgendamento && isSelected && <span className="w-1.5 h-1.5 bg-amber-300 rounded-full absolute bottom-1"></span>}
                </button>
              );
            })}
          </div>
        </div>
      );
    }

      // CARREGAR CONSULTA DO LINK DE CONFIRMAÇÃO SE ABRIR VIA PACIENTE
      useEffect(() => {
        if (confirmarIdParam && isSupabaseConfigured) {
          supabase
            .from('consultas')
            .select('*')
            .eq('id', confirmarIdParam)
            .single()
            .then(({ data, error }) => {
              if (data && !error) {
                setConsultaParaConfirmar(data);
                if (data.status === 'Confirmado') setConfirmadoSucesso(true);
              }
              setCarregandoConfirmacao(false);
            });

      }, [confirmarIdParam]);

      useEffect(() => {
        if (isSupabaseConfigured && !confirmarIdParam) {

      useEffect(() => {
        if (selectedPaciente && isSupabaseConfigured) {
          carregarDocumentos(selectedPaciente.id);
          carregarFichas(selectedPaciente.id);
        }
      }, [selectedPaciente]);

      useEffect(() => {
        if (pacientes.length > 0) {
          const today = new Date();
          const mm = String(today.getMonth() + 1).padStart(2, '0');
          const dd = String(today.getDate()).padStart(2, '0');
          const todayMMDD = `${mm}-${dd}`;

          const niverHoje = pacientes.filter(p => {
            if (!p.data_nascimento) return false;
            const parts = p.data_nascimento.split('-');
            return parts.length >= 3 && `${parts[1]}-${parts[2]}` === todayMMDD;
          });

          setAniversariantesHoje(niverHoje);
          if (niverHoje.length > 0 && !localStorage.getItem(`hide_birthday_popup_${todayStr}`)) {
            setShowPopupAniversario(true);
          }
        }
      }, [pacientes]);

      function salvarTemplateMsg(texto) {
        setTemplateMsg(texto);
        localStorage.setItem('template_whatsapp_dra', texto);
      }

      function gerarLinkWhatsapp(c) {
        const pacienteObj = pacientes.find(p => p.id === c.paciente_id);
        const telefoneRaw = pacienteObj?.telefone || '';
        const telefoneApenasNumeros = telefoneRaw.replace(/\D/g, '');

        const dataFormatada = c.data ? new Date(c.data + 'T00:00:00').toLocaleDateString('pt-BR') : '';
        const linkConfirmacao = `${window.location.origin}${window.location.pathname}?confirmar_id=${c.id}`;

        let textoFinal = templateMsg
          .replace(/{paciente}/g, c.paciente_nome || 'Paciente')
          .replace(/{procedimento}/g, c.procedimento || '')
          .replace(/{data}/g, dataFormatada)
          .replace(/{hora}/g, c.hora || '')
          .replace(/{link}/g, linkConfirmacao);

        const urlWa = `https://wa.me/55${telefoneApenasNumeros}?text=${encodeURIComponent(textoFinal)}`;
        window.open(urlWa, '_blank');
      }

      async function handlePacienteConfirmarPresenca() {
        if (!consultaParaConfirmar) return;

        const { error } = await supabase
          .from('consultas')
          .update({ status: 'Confirmado' })
          .eq('id', consultaParaConfirmar.id);

        if (!error) {
          setConfirmadoSucesso(true);
        } else {
          alert("Erro ao confirmar agendamento: " + error.message);
        }
      }

      function handleFecharPopupAniversario(naoMostrarMais = false) {
        if (naoMostrarMais) localStorage.setItem(`hide_birthday_popup_${todayStr}`, 'true');
        setShowPopupAniversario(false);
      }

      async function carregarDados() {
        setLoading(true);
        try {
          const { data: pData } = await supabase.from('pacientes').select('*').order('nome', { ascending: true });
          if (pData) setPacientes(pData);

          const { data: cData } = await supabase.from('consultas').select('*').order('data', { ascending: true }).order('hora', { ascending: true });
          if (cData) setConsultas(cData);
        } catch (err) {
          console.error("Erro ao carregar dados:", err);
        } finally {
          setLoading(false);
        }
      }

      async function carregarSaidas() {
        try {
          const { data, error } = await supabase.from('saidas').select('*').order('data', { ascending: false });
          if (!error && data) setSaidas(data);
        } catch (err) {}
      }

      async function carregarDocumentos(pacienteId) {
        try {
          const { data, error } = await supabase.from('documentos').select('*').eq('paciente_id', pacienteId).order('created_at', { ascending: false });
          if (!error && data) setDocumentos(data);
        } catch (err) {}
      }

      async function carregarFichas(pacienteId) {
        try {
          const { data, error } = await supabase.from('fichas_anamnese').select('*').eq('paciente_id', pacienteId).order('data', { ascending: false });
          if (!error && data) setFichasAnamnese(data);
        } catch (err) {}
      }

      async function handleAddPaciente(e) {
        e.preventDefault();
        if (!formPaciente.nome || !formPaciente.telefone) return alert("Por favor, preencha o nome e o telefone.");

        const { data, error } = await supabase.from('pacientes').insert([formPaciente]).select();
        if (!error && data) {
          setPacientes([...pacientes, data[0]].sort((a,b) => a.nome.localeCompare(b.nome)));
          setFormPaciente({ nome: '', telefone: '', data_nascimento: '', observacoes: '' });
          setShowNovoPaciente(false);
        }
      }

      function handleAbrirEditar(paciente) {
        setFormPaciente({
          nome: paciente.nome || '',
          telefone: paciente.telefone || '',
          data_nascimento: paciente.data_nascimento || '',
          observacoes: paciente.observacoes || ''
        });
        setShowEditarPaciente(true);
      }

      async function handleSalvarEdicao(e) {
        e.preventDefault();
        if (!selectedPaciente) return;

        const { data, error } = await supabase.from('pacientes').update(formPaciente).eq('id', selectedPaciente.id).select();
        if (!error && data) {
          setPacientes(pacientes.map(p => p.id === selectedPaciente.id ? data[0] : p));
          setSelectedPaciente(data[0]);
          setShowEditarPaciente(false);
        }
      }

      async function handleExcluirPaciente(id) {
        if (confirm("Tem certeza que deseja excluir esta paciente?")) {
          const { error } = await supabase.from('pacientes').delete().eq('id', id);
          if (!error) {
            setPacientes(pacientes.filter(p => p.id !== id));
            setSelectedPaciente(null);
          }
        }
      }

      async function handleSalvarFicha(e) {
        e.preventDefault();
        if (!selectedPaciente) return;

        const payload = {
          paciente_id: selectedPaciente.id,
          tipo_ficha: formFicha.tipo_ficha,
          data: formFicha.data,
          queixa_principal: formFicha.queixa_principal,
          avaliacao_medica: formFicha.avaliacao_medica,
          respostas_especificas: formFicha.respostas_especificas
        };

        const { data, error } = await supabase.from('fichas_anamnese').insert([payload]).select();
        if (!error && data) {
          setFichasAnamnese([data[0], ...fichasAnamnese]);
          setShowNovaFicha(false);
          setFormFicha({ tipo_ficha: TIPOS_ANAMNESE[0], data: todayStr, queixa_principal: '', avaliacao_medica: '', respostas_especificas: {} });
          alert("Ficha de Anamnese salva!");
        }
      }

      async function handleExcluirFicha(fichaId) {
        if (confirm("Deseja excluir esta ficha?")) {
          const { error } = await supabase.from('fichas_anamnese').delete().eq('id', fichaId);
          if (!error) setFichasAnamnese(fichasAnamnese.filter(f => f.id !== fichaId));
        }
      }

      async function handleAddDocumento(e) {
        e.preventDefault();
        if (!formDoc.titulo || !formDoc.file || !selectedPaciente) return alert("Preencha o título e o ficheiro.");

        setUploading(true);
        try {
          const file = formDoc.file;
          const fileName = `${selectedPaciente.id}/${formDoc.categoria}/${Date.now()}.${file.name.split('.').pop()}`;

          const { error: uploadErr } = await supabase.storage.from('prontuarios').upload(fileName, file);
          if (uploadErr) throw uploadErr;

          const publicUrl = supabase.storage.from('prontuarios').getPublicUrl(fileName).data.publicUrl;
          const { data: docData, error: docErr } = await supabase.from('documentos').insert([{
            paciente_id: selectedPaciente.id,
            titulo: formDoc.titulo,
            descricao: formDoc.descricao || '',
            categoria: formDoc.categoria,
            url: publicUrl,
            tipo: file.type.includes('image') ? 'imagem' : 'documento'
          }]).select();

          if (docData) {
            setDocumentos([docData[0], ...documentos]);
            setFormDoc({ titulo: '', descricao: '', categoria: 'Fotos', file: null });
            setShowNovoDoc(false);
          }
        } catch (err) {
          alert("Erro no envio: " + err.message);
        } finally {
          setUploading(false);
        }
      }

      async function handleExcluirDoc(docId) {
        if (confirm("Deseja remover este documento?")) {
          const { error } = await supabase.from('documentos').delete().eq('id', docId);
          if (!error) setDocumentos(documentos.filter(d => d.id !== docId));
        }
      }

      async function handleAddSaida(e) {
        e.preventDefault();
        if (!formSaida.valor) return alert("Informe o valor da saída.");

        const payload = { categoria: formSaida.categoria, valor: Number(formSaida.valor || 0), data: formSaida.data, observacoes: formSaida.observacoes || '' };
        
        if (isSupabaseConfigured) {
          try {
            const { data, error } = await supabase.from('saidas').insert([payload]).select();
            if (!error && data) {
              setSaidas([data[0], ...saidas]);
            } else {
              setSaidas([{ id: Date.now(), ...payload }, ...saidas]);
            }
          } catch (e) {
            setSaidas([{ id: Date.now(), ...payload }, ...saidas]);
          }
        } else {
          setSaidas([{ id: Date.now(), ...payload }, ...saidas]);
        }

        setFormSaida({ categoria: 'Uso Pessoal', valor: '', data: todayStr, observacoes: '' });
        setShowNovaSaida(false);
        alert("Saída de caixa adicionada!");
      }

      async function handleExcluirSaida(id) {
        if (confirm("Deseja excluir esta saída?")) {
          if (isSupabaseConfigured) {
            try { await supabase.from('saidas').delete().eq('id', id); } catch (e) {}
          }
          setSaidas(saidas.filter(s => s.id !== id));
        }
      }

      function handleAbrirNovoAgendamento(pacientePreSelecionado = null) {
        setModoPacienteManual(pacientePreSelecionado ? false : pacientes.length === 0);
        setFormConsulta({
          id: null,
          paciente_id: pacientePreSelecionado?.id || pacientes[0]?.id || '',
          paciente_nome: pacientePreSelecionado?.nome || pacientes[0]?.nome || '',
          procedimento: PROCEDIMENTOS_PRESET[0].nome,
          procedimento_custom: '',
          sessao: OPCOES_SESSAO[0],
          duracao: OPCOES_DURACAO[0],
          data: todayStr,
          hora: '14:00',
          valor: '',
          status: 'Agendado',
          status_pagamento: 'Pendente',
          observacoes: ''
        });
        setShowNovaConsulta(true);
      }

      async function handleAddConsulta(e) {
        e.preventDefault();
        const procFinal = formConsulta.procedimento === "Outro Procedimento..." ? formConsulta.procedimento_custom : formConsulta.procedimento;
        if (!procFinal || !formConsulta.paciente_nome) return alert("Informe a paciente e o procedimento.");

        const payload = {
          paciente_id: formConsulta.paciente_id || null,
          paciente_nome: formConsulta.paciente_nome,
          procedimento: procFinal,
          sessao: formConsulta.sessao || OPCOES_SESSAO[0],
          duracao: formConsulta.duracao || OPCOES_DURACAO[0],
          data: formConsulta.data,
          hora: formConsulta.hora,
          data_hora: formConsulta.data && formConsulta.hora ? `${formConsulta.data}T${formConsulta.hora}:00` : null,
          valor: Number(formConsulta.valor || 0),
          status: formConsulta.status || 'Agendado',
          status_pagamento: formConsulta.status_pagamento || 'Pendente',
          observacoes: formConsulta.observacoes || ''
        };

        let { data, error } = await supabase.from('consultas').insert([payload]).select();
        if (error && error.message.includes('duracao')) {
          delete payload.duracao;
          const res = await supabase.from('consultas').insert([payload]).select();
          data = res.data;
          error = res.error;
        }

        if (!error && data) {
          setConsultas([...consultas, { ...data[0], duracao: formConsulta.duracao }]);
          setShowNovaConsulta(false);
          alert("Agendamento criado!");
        }
      }

      function handleAbrirEditarConsulta(c) {
        setFormConsulta({
          id: c.id,
          paciente_id: c.paciente_id || '',
          paciente_nome: c.paciente_nome || '',
          procedimento: c.procedimento,
          procedimento_custom: '',
          sessao: c.sessao || OPCOES_SESSAO[0],
          duracao: c.duracao || OPCOES_DURACAO[0],
          data: c.data || todayStr,
          hora: c.hora || '14:00',
          valor: c.valor || '',
          status: c.status || 'Agendado',
          status_pagamento: c.status_pagamento || 'Pendente',
          observacoes: c.observacoes || ''
        });
        setShowEditarConsulta(true);
      }

      async function handleSalvarEdicaoConsulta(e) {
        e.preventDefault();
        const procFinal = formConsulta.procedimento === "Outro Procedimento..." ? formConsulta.procedimento_custom : formConsulta.procedimento;

        const payload = {
          paciente_id: formConsulta.paciente_id || null,
          paciente_nome: formConsulta.paciente_nome,
          procedimento: procFinal,
          sessao: formConsulta.sessao || OPCOES_SESSAO[0],
          duracao: formConsulta.duracao || OPCOES_DURACAO[0],
          data: formConsulta.data,
          hora: formConsulta.hora,
          data_hora: formConsulta.data && formConsulta.hora ? `${formConsulta.data}T${formConsulta.hora}:00` : null,
          valor: Number(formConsulta.valor || 0),
          status: formConsulta.status,
          status_pagamento: formConsulta.status_pagamento || 'Pendente',
          observacoes: formConsulta.observacoes || ''
        };

        let { data, error } = await supabase.from('consultas').update(payload).eq('id', formConsulta.id).select();
        if (error && error.message.includes('duracao')) {
          delete payload.duracao;
          const res = await supabase.from('consultas').update(payload).eq('id', formConsulta.id).select();
          data = res.data;
          error = res.error;
        }

        if (!error && data) {
          setConsultas(consultas.map(c => c.id === formConsulta.id ? { ...data[0], duracao: formConsulta.duracao } : c));
          setShowEditarConsulta(false);
        }
      }

      async function handleConfirmarPagamento(id) {
        const { data, error } = await supabase.from('consultas').update({ status_pagamento: 'Recebido' }).eq('id', id).select();
        if (!error && data) setConsultas(consultas.map(c => c.id === id ? data[0] : c));
      }

      async function handleExcluirConsulta(id) {
        if (confirm("Deseja excluir este agendamento?")) {
          const { error } = await supabase.from('consultas').delete().eq('id', id);
          if (!error) setConsultas(consultas.filter(c => c.id !== id));
        }
      }

      // --- TELA PÚBLICA DE CONFIRMAÇÃO DO PACIENTE ---
      if (confirmarIdParam) {
        return (
          <div className="max-w-md mx-auto min-h-screen p-4 flex flex-col justify-center items-center">
            <div className="bg-white/95 backdrop-blur-md w-full rounded-3xl p-6 shadow-2xl border border-rose-100 text-center space-y-5">
              
              <div className="w-20 h-20 rounded-2xl overflow-hidden mx-auto border-2 border-rose-300 shadow-md bg-[#e2c7b5] p-0.5">
                <img src="Ícone.png" alt="Dra. Isabella Duarte" className="w-full h-full object-cover" style={{ transform: 'scale(2.35)' }} />
              </div>

              <div>
                <span className="text-[10px] uppercase font-extrabold tracking-widest text-rose-800 bg-rose-50 px-3 py-1 rounded-full">
                  Confirmação de Agendamento
                </span>
                <h1 className="text-xl font-extrabold text-slate-800 mt-2">Dra. Isabella Duarte</h1>
                <p className="text-xs text-slate-500">Estética Avançada</p>
              </div>

              {carregandoConfirmacao ? (
                <p className="text-xs text-slate-400 py-6">A carregar detalhes do agendamento...</p>
              ) : !consultaParaConfirmar ? (
                <p className="text-xs text-rose-700 bg-rose-50 p-4 rounded-2xl font-bold">
                  Agendamento não encontrado ou já foi alterado.
                </p>
              ) : confirmadoSucesso ? (
                <div className="space-y-4 pt-2">
                  <div className="bg-emerald-50 border border-emerald-200 text-emerald-900 p-5 rounded-2xl text-xs space-y-2 text-center">
                    <div className="w-12 h-12 bg-emerald-100 text-emerald-800 rounded-full flex items-center justify-center text-xl mx-auto font-black">
                      ✓
                    </div>
                    <p className="font-extrabold text-sm text-emerald-950">Presença Confirmada com Sucesso!</p>
                    <p className="text-slate-600 leading-relaxed">
                      Sua reserva foi gravada na agenda da Dra. Isabella Duarte para o dia <strong>{new Date(consultaParaConfirmar.data + 'T00:00:00').toLocaleDateString('pt-BR')}</strong> às <strong>{consultaParaConfirmar.hora}</strong>.
                    </p>
                  </div>
                </div>
              ) : (
                <div className="space-y-4 text-xs text-left">
                  {/* DADOS DA CONSULTA */}
                  <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-1.5">
                    <p><strong>Paciente:</strong> {consultaParaConfirmar.paciente_nome}</p>
                    <p><strong>Procedimento:</strong> {consultaParaConfirmar.procedimento}</p>
                    <p><strong>Data:</strong> {new Date(consultaParaConfirmar.data + 'T00:00:00').toLocaleDateString('pt-BR')}</p>
                    <p><strong>Horário:</strong> {consultaParaConfirmar.hora}</p>
                  </div>

                  {/* AVISO DO SINAL EXIBIDO ANTES DE CONFIRMAR */}
                  <div className="bg-amber-50 border border-amber-300 p-4 rounded-2xl space-y-2 text-amber-950">
                    <p className="font-black text-amber-900 flex items-center gap-1.5 text-xs">
                      ⚠️ AVISO IMPORTANTE SOBRE A RESERVA
                    </p>
                    <p className="leading-relaxed text-[11px]">
                      O valor pago como <strong>sinal de reserva</strong> garante a reserva do horário exclusivo da Dra. Isabella para o seu atendimento.
                    </p>
                    <div className="bg-amber-100/80 p-2.5 rounded-xl border border-amber-200 text-[11px] font-bold text-rose-950">
                      Em caso de não comparecimento ou falta sem aviso prévio de pelo menos 24 horas de antecedência, o valor pago do sinal não será reembolsado.
                    </div>
                  </div>

                  <p className="text-center font-bold text-slate-700 pt-1">
                    Ao clicar no botão abaixo, você declara estar ciente do aviso acima e confirma a sua presença:
                  </p>

                  <button 
                    onClick={handlePacienteConfirmarPresenca}
                    className="w-full py-4 bg-emerald-700 hover:bg-emerald-800 text-white font-extrabold rounded-2xl text-xs shadow-md active:scale-95 transition-all flex items-center justify-center gap-2"
                  >
                    <IconCheck /> <span>ESTOU CIENTE E CONFIRMO PRESENÇA</span>
                  </button>
                </div>
              )}

            </div>
          </div>
        );
      }

      // --- TELA PRINCIPAL DO APLICATIVO ---
      const pacientesFiltrados = pacientes.filter(p => (p.nome && p.nome.toLowerCase().includes(busca.toLowerCase())) || (p.telefone && p.telefone.includes(busca)));
      const documentosFiltrados = documentos.filter(d => categoriaFiltro === 'Todas' || (d.categoria || 'Fotos') === categoriaFiltro);
      const consultasDoDia = consultas.filter(c => (c.data || (c.data_hora ? c.data_hora.split('T')[0] : '')) === dataFiltro);

      const consultasValidas = consultas.filter(c => c.status !== 'Cancelado');
      const valorAReceber = consultasValidas.filter(c => (c.status_pagamento || 'Pendente') === 'Pendente').reduce((acc, c) => acc + Number(c.valor || 0), 0);
      const valorRecebido = consultasValidas.filter(c => c.status_pagamento === 'Recebido').reduce((acc, c) => acc + Number(c.valor || 0), 0);
      const previsaoTotal = valorAReceber + valorRecebido;
      const totalSaidas = saidas.reduce((acc, s) => acc + Number(s.valor || 0), 0);

      const consultasFinanceiro = consultasValidas.filter(c => {
        const pag = c.status_pagamento || 'Pendente';
        if (filtroFinanceiro === 'Futuros') return pag === 'Pendente';
        if (filtroFinanceiro === 'Recebidos') return pag === 'Recebido';
        return true;
      });

      const questoesAtuais = QUESTOES_POR_FICHA[formFicha.tipo_ficha] || [];

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col bg-[#faf7f8]/90 backdrop-blur-sm shadow-2xl">
          
          {/* CABEÇALHO */}
          <header className="bg-gradient-to-r from-rose-950/95 via-rose-900/95 to-rose-950/95 text-white p-5 rounded-b-3xl shadow-lg flex justify-between items-center sticky top-0 z-20 border-b border-rose-800/40 backdrop-blur-md">
            <div>
              <span className="text-[10px] uppercase tracking-widest text-rose-300 font-bold block">Estética Avançada</span>
              <h1 className="text-lg font-bold tracking-tight text-rose-50">Dra. Isabella Duarte</h1>
            </div>
            <div className="w-12 h-12 rounded-2xl overflow-hidden flex items-center justify-center border-2 border-rose-400/40 shadow-md bg-[#e2c7b5] p-0.5">
              <img src="Ícone.png" alt="Dra. Isabella Duarte" className="w-full h-full object-cover" style={{ transform: 'scale(2.35)' }} />
            </div>
          </header>

          <main className="flex-1 p-4 space-y-4 overflow-y-auto max-h-[calc(100vh-140px)] custom-scrollbar">

            {/* DASHBOARD */}
            {activeTab === 'dashboard' && (
              <div className="space-y-4">
                {aniversariantesHoje.length > 0 && (
                  <div className="bg-gradient-to-r from-amber-500 to-rose-600 text-white p-4 rounded-3xl shadow-md flex items-center justify-between">
                    <div className="flex items-center gap-3">
                      <span className="text-2xl">🎂</span>
                      <div>
                        <p className="text-[10px] uppercase font-bold text-amber-100 tracking-wider">Aniversariante(s) de Hoje</p>
                        <p className="text-xs font-extrabold mt-0.5">{aniversariantesHoje.map(p => p.nome).join(', ')}</p>
                      </div>
                    </div>
                    <button onClick={() => setShowPopupAniversario(true)} className="px-3 py-1.5 bg-white/20 hover:bg-white/30 backdrop-blur-md rounded-xl text-xs font-bold border border-white/20">Ver</button>
                  </div>
                )}

                <div className="bg-gradient-to-br from-rose-900 via-rose-800 to-rose-950 text-white p-5 rounded-3xl shadow-md">
                  <p className="text-[11px] text-rose-200 uppercase tracking-widest font-semibold">Resumo Geral</p>
                  <h2 className="text-2xl font-extrabold mt-0.5 text-white">Hoje</h2>
                  <div className="grid grid-cols-2 gap-3 mt-4">
                    <div className="bg-white/10 backdrop-blur-md p-3.5 rounded-2xl border border-white/10">
                      <p className="text-[11px] text-rose-200">Atendimentos Hoje</p>
                      <p className="text-2xl font-black mt-0.5">{consultas.filter(c => (c.data || (c.data_hora ? c.data_hora.split('T')[0] : '')) === todayStr).length}</p>
                    </div>
                    <div className="bg-white/10 backdrop-blur-md p-3.5 rounded-2xl border border-white/10">
                      <p className="text-[11px] text-rose-200">Total Pacientes</p>
                      <p className="text-2xl font-black mt-0.5">{pacientes.length}</p>
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <button onClick={() => setShowNovoPaciente(true)} className="p-4 bg-white/90 backdrop-blur-md border border-rose-100/80 rounded-2xl shadow-sm text-left flex items-center justify-between">
                    <div>
                      <p className="text-xs font-bold text-slate-800">+ Paciente</p>
                      <p className="text-[10px] text-slate-400 mt-0.5">Novo cadastro</p>
                    </div>
                    <div className="w-8 h-8 rounded-xl bg-rose-50 text-rose-700 flex items-center justify-center"><IconUsers /></div>
                  </button>

                  <button onClick={() => handleAbrirNovoAgendamento()} className="p-4 bg-white/90 backdrop-blur-md border border-rose-100/80 rounded-2xl shadow-sm text-left flex items-center justify-between">
                    <div>
                      <p className="text-xs font-bold text-slate-800">+ Agendar</p>
                      <p className="text-[10px] text-slate-400 mt-0.5">Nova consulta</p>
                    </div>
                    <div className="w-8 h-8 rounded-xl bg-rose-50 text-rose-700 flex items-center justify-center"><IconCalendar /></div>
                  </button>
                </div>
              </div>
            )}

            {/* PACIENTES */}
            {activeTab === 'pacientes' && !selectedPaciente && (
              <div className="space-y-3">
                <div className="flex justify-between items-center">
                  <h2 className="text-sm font-bold text-slate-800 uppercase tracking-wider">Prontuário de Pacientes</h2>
                  <button onClick={() => setShowNovoPaciente(true)} className="px-3 py-1.5 bg-rose-900 text-white rounded-xl text-xs font-bold flex items-center gap-1">
                    <IconPlus /> <span>Cadastrar</span>
                  </button>
                </div>

                <div className="relative">
                  <div className="absolute inset-y-0 left-3 flex items-center pointer-events-none"><IconSearch /></div>
                  <input type="text" placeholder="Buscar por nome ou telefone..." className="w-full pl-9 pr-4 py-2.5 bg-white/90 border rounded-2xl text-xs" value={busca} onChange={e => setBusca(e.target.value)} />
                </div>

                <div className="space-y-2">
                  {pacientesFiltrados.map(p => (
                    <div key={p.id} onClick={() => setSelectedPaciente(p)} className="p-3.5 bg-white/90 border border-slate-100 rounded-2xl shadow-sm flex items-center justify-between cursor-pointer">
                      <div>
                        <p className="font-bold text-slate-800 text-xs">{p.nome}</p>
                        <p className="text-[11px] text-slate-400">{p.telefone || 'Sem telefone'}</p>
                      </div>
                      <span className="text-slate-300 font-bold">›</span>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* PERFIL DO PACIENTE */}
            {selectedPaciente && (
              <div className="space-y-4">
                <div className="flex justify-between items-center">
                  <button onClick={() => setSelectedPaciente(null)} className="text-xs text-rose-800 font-bold bg-white/90 px-3 py-1.5 rounded-xl border">‹ Voltar</button>
                  <div className="flex gap-2">
                    <button onClick={() => handleAbrirNovoAgendamento(selectedPaciente)} className="p-2 bg-rose-900 text-white rounded-xl font-bold text-xs flex items-center gap-1"><IconCalendar /> <span>Agendar</span></button>
                    <button onClick={() => handleAbrirEditar(selectedPaciente)} className="p-2 bg-amber-50 text-amber-800 rounded-xl border"><IconEdit /></button>
                    <button onClick={() => handleExcluirPaciente(selectedPaciente.id)} className="p-2 bg-rose-50 text-rose-800 rounded-xl border"><IconTrash /></button>
                  </div>
                </div>

                <div className="bg-white/90 p-4 rounded-3xl border space-y-2 text-xs">
                  <h2 className="text-base font-extrabold text-slate-800">{selectedPaciente.nome}</h2>
                  <p>📞 <strong>Tel:</strong> {selectedPaciente.telefone || 'Não informado'}</p>
                  <p>🎂 <strong>Nascimento:</strong> {selectedPaciente.data_nascimento ? new Date(selectedPaciente.data_nascimento + 'T00:00:00').toLocaleDateString('pt-BR') : 'Não informada'}</p>
                </div>
              </div>
            )}

            {/* AGENDA COMPLETA */}
            {activeTab === 'agenda' && (
              <div className="space-y-4">
                <div className="flex justify-between items-center">
                  <h2 className="text-sm font-bold text-slate-800 uppercase tracking-wider">Agenda de Atendimentos</h2>
                  <div className="flex gap-1.5">
                    <button onClick={() => setShowConfigMsg(true)} className="px-2.5 py-1.5 bg-emerald-50 text-emerald-900 border border-emerald-200 rounded-xl text-[10px] font-bold flex items-center gap-1">
                      <IconWhatsapp /> <span>Mensagem</span>
                    </button>
                    <button onClick={() => handleAbrirNovoAgendamento()} className="px-3 py-1.5 bg-rose-900 text-white rounded-xl text-xs font-bold flex items-center gap-1">
                      <IconPlus /> <span>Agendar</span>
                    </button>
                  </div>
                </div>

                <CalendarWidget dataFiltro={dataFiltro} setDataFiltro={setDataFiltro} consultas={consultas} />

                {consultasDoDia.length === 0 ? (
                  <div className="text-center py-10 border border-dashed rounded-3xl bg-white/90">
                    <p className="text-xs text-slate-400">Nenhuma consulta agendada para este dia.</p>
                  </div>
                ) : (
                  <div className="space-y-2.5">
                    {consultasDoDia.map(c => {
                      const foiPago = c.status_pagamento === 'Recebido';
                      const estaConfirmado = c.status === 'Confirmado';

                      return (
                        <div key={c.id} className="p-4 bg-white/90 rounded-2xl border shadow-sm space-y-2.5">
                          <div className="flex justify-between items-start">
                            <div>
                              <div className="flex items-center gap-1.5 flex-wrap">
                                <span className="text-xs font-extrabold text-slate-900">{c.hora || '14:00'}</span>
                                
                                <span className={`px-2 py-0.5 text-[9px] font-bold rounded-lg ${
                                  estaConfirmado ? 'bg-emerald-100 text-emerald-900 border border-emerald-300 font-extrabold' :
                                  c.status === 'Concluído' ? 'bg-blue-100 text-blue-800' :
                                  c.status === 'Cancelado' ? 'bg-rose-100 text-rose-800' :
                                  'bg-amber-100 text-amber-800'
                                }`}>
                                  {estaConfirmado ? '✅ Confirmado' : c.status || 'Agendado'}
                                </span>

                                <span className="px-2 py-0.5 text-[9px] font-bold rounded-lg bg-slate-100 text-slate-700">⏱️ {c.duracao || '1 hora'}</span>
                              </div>
                              <h3 className="font-bold text-slate-800 text-sm mt-1">{c.paciente_nome}</h3>
                              <p className="text-xs text-rose-900 font-semibold">{c.procedimento}</p>
                            </div>
                            
                            <div className="text-right flex flex-col items-end gap-1.5">
                              <span className="font-extrabold text-slate-900 text-xs block">R$ {Number(c.valor || 0).toFixed(2)}</span>
                              
                              <div className="flex items-center gap-1 mt-1">
                                <button 
                                  onClick={() => gerarLinkWhatsapp(c)}
                                  className="px-2 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-[10px] font-bold flex items-center gap-1 shadow-xs active:scale-95"
                                  title="Enviar Link de Confirmação por WhatsApp"
                                >
                                  <IconWhatsapp /> <span>Confirmar</span>
                                </button>

                                <button onClick={() => baixarEventoICS(c)} className="px-2 py-1 bg-rose-50 border border-rose-200 text-rose-950 rounded-lg text-[10px] font-bold">
                                  <span>📅 iOS</span>
                                </button>
                                <button onClick={() => handleAbrirEditarConsulta(c)} className="p-1.5 bg-slate-100 text-slate-700 rounded-lg"><IconEdit /></button>
                                <button onClick={() => handleExcluirConsulta(c.id)} className="p-1.5 bg-rose-50 text-rose-700 rounded-lg"><IconTrash /></button>
                              </div>
                            </div>
                          </div>

                          <div className="pt-2 border-t flex justify-between items-center text-xs">
                            <span className="text-[11px] text-slate-500 font-medium">Pagamento:</span>
                            {foiPago ? (
                              <span className="px-2.5 py-1 bg-emerald-50 text-emerald-700 border text-[10px] font-bold rounded-xl flex items-center gap-1"><IconCheck /> <span>Pago</span></span>
                            ) : (
                              <button onClick={() => handleConfirmarPagamento(c.id)} className="px-2.5 py-1 bg-emerald-100 text-emerald-900 text-[10px] font-extrabold rounded-xl flex items-center gap-1">
                                <IconCheck /> <span>Dar Baixa</span>
                              </button>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            )}

            {/* FINANCEIRO COMPLETO */}
            {activeTab === 'financeiro' && (
              <div className="space-y-4">
                <div className="flex justify-between items-center">
                  <h2 className="text-sm font-bold text-slate-800 uppercase tracking-wider">Controle Financeiro</h2>
                  <button 
                    onClick={() => setShowNovaSaida(true)} 
                    className="px-3.5 py-2 bg-rose-900 text-white rounded-xl text-xs font-bold shadow-md active:scale-95"
                  >
                    Adicionar Saída
                  </button>
                </div>

                {/* OS 4 CARTÕES FINANCEIROS */}
                <div className="grid grid-cols-2 gap-3">
                  <div className="bg-amber-500/90 backdrop-blur-md text-white p-4 rounded-3xl shadow-sm border border-amber-400 flex flex-col justify-between min-h-[105px]">
                    <div>
                      <p className="text-[10px] uppercase font-bold text-amber-100 tracking-wider">⏳ Lançamentos Futuros</p>
                      <p className="text-lg font-black mt-1">R$ {valorAReceber.toFixed(2)}</p>
                    </div>
                    <p className="text-[9px] text-amber-100">A receber</p>
                  </div>

                  <div className="bg-emerald-700/90 backdrop-blur-md text-white p-4 rounded-3xl shadow-sm border border-emerald-600 flex flex-col justify-between min-h-[105px]">
                    <div>
                      <p className="text-[10px] uppercase font-bold text-emerald-100 tracking-wider">✅ Entrou em Caixa</p>
                      <p className="text-lg font-black mt-1">R$ {valorRecebido.toFixed(2)}</p>
                    </div>
                    <p className="text-[9px] text-emerald-100">Confirmado</p>
                  </div>

                  <div className="bg-slate-900/90 backdrop-blur-md text-white p-4 rounded-3xl shadow-sm border border-slate-700 flex flex-col justify-between min-h-[105px]">
                    <div>
                      <p className="text-[10px] uppercase font-bold text-slate-300 tracking-wider">💰 Previsão Total</p>
                      <p className="text-lg font-black mt-1">R$ {previsaoTotal.toFixed(2)}</p>
                    </div>
                    <p className="text-[9px] text-slate-400">Caixa + Futuro</p>
                  </div>

                  <div className="bg-rose-900/90 backdrop-blur-md text-white p-4 rounded-3xl shadow-sm border border-rose-700 flex flex-col justify-between min-h-[105px]">
                    <div>
                      <p className="text-[10px] uppercase font-bold text-rose-200 tracking-wider">💸 Saídas de Caixa</p>
                      <p className="text-lg font-black mt-1">R$ {totalSaidas.toFixed(2)}</p>
                    </div>
                    <p className="text-[9px] text-rose-200">Despesas e Gastos</p>
                  </div>
                </div>

                {/* BOTÕES DE FILTRO */}
                <div className="flex bg-slate-200/70 p-1 rounded-2xl text-xs font-bold text-slate-600 gap-1 backdrop-blur-sm">
                  <button 
                    onClick={() => setFiltroFinanceiro('Futuros')}
                    className={`flex-1 py-2 rounded-xl text-center transition-all ${
                      filtroFinanceiro === 'Futuros' ? 'bg-white text-slate-900 shadow-sm font-extrabold' : 'hover:text-slate-900'
                    }`}
                  >
                    ⏳ Futuros
                  </button>
                  <button 
                    onClick={() => setFiltroFinanceiro('Recebidos')}
                    className={`flex-1 py-2 rounded-xl text-center transition-all ${
                      filtroFinanceiro === 'Recebidos' ? 'bg-white text-slate-900 shadow-sm font-extrabold' : 'hover:text-slate-900'
                    }`}
                  >
                    ✅ Recebidos
                  </button>
                  <button 
                    onClick={() => setFiltroFinanceiro('Saidas')}
                    className={`flex-1 py-2 rounded-xl text-center transition-all ${
                      filtroFinanceiro === 'Saidas' ? 'bg-white text-slate-900 shadow-sm font-extrabold' : 'hover:text-slate-900'
                    }`}
                  >
                    💸 Saídas
                  </button>
                  <button 
                    onClick={() => setFiltroFinanceiro('Todos')}
                    className={`px-3 py-2 rounded-xl text-center transition-all ${
                      filtroFinanceiro === 'Todos' ? 'bg-white text-slate-900 shadow-sm font-extrabold' : 'hover:text-slate-900'
                    }`}
                  >
                    Todos
                  </button>
                </div>

                {/* LISTA DE SAÍDAS OU RECEBIMENTOS */}
                {filtroFinanceiro === 'Saidas' ? (
                  saidas.length === 0 ? (
                    <div className="text-center py-10 border border-dashed border-slate-200 rounded-3xl bg-white/90 backdrop-blur-md space-y-2">
                      <p className="text-xs text-slate-400">Nenhuma saída de caixa registrada.</p>
                      <button 
                        onClick={() => setShowNovaSaida(true)} 
                        className="px-3.5 py-1.5 bg-rose-900 text-white rounded-xl text-xs font-bold"
                      >
                        Adicionar Saída
                      </button>
                    </div>
                  ) : (
                    <div className="space-y-2.5">
                      {saidas.map(s => (
                        <div key={s.id} className="p-4 bg-white/90 backdrop-blur-md border border-slate-100 rounded-2xl shadow-sm space-y-1.5">
                          <div className="flex justify-between items-start">
                            <div>
                              <span className="px-2 py-0.5 text-[9px] font-bold rounded-lg bg-rose-100 text-rose-900 inline-block mb-1">
                                {s.categoria || 'Despesa'}
                              </span>
                              <p className="text-[10px] text-slate-400 font-bold block">
                                📅 {s.data ? new Date(s.data + 'T00:00:00').toLocaleDateString('pt-BR') : 'Data não definida'}
                              </p>
                              {s.observacoes && (
                                <p className="text-[11px] text-slate-600 mt-1 bg-slate-50 p-2 rounded-xl border border-slate-100">
                                  📝 {s.observacoes}
                                </p>
                              )}
                            </div>
                            <div className="text-right">
                              <span className="font-extrabold text-rose-800 text-sm block">
                                - R$ {Number(s.valor || 0).toFixed(2)}
                              </span>
                              <button onClick={() => handleExcluirSaida(s.id)} className="text-rose-600 p-1 mt-1">
                                <IconTrash />
                              </button>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  )
                ) : (
                  consultasFinanceiro.length === 0 ? (
                    <div className="text-center py-10 border border-dashed border-slate-200 rounded-3xl bg-white/90 backdrop-blur-md">
                      <p className="text-xs text-slate-400">Nenhum lançamento nesta categoria.</p>
                    </div>
                  ) : (
                    <div className="space-y-2.5">
                      {consultasFinanceiro.map(c => {
                        const foiPago = c.status_pagamento === 'Recebido';
                        const dataExibicao = c.data || (c.data_hora ? c.data_hora.split('T')[0] : '');
                        return (
                          <div key={c.id} className="p-4 bg-white/90 backdrop-blur-md border border-slate-100 rounded-2xl shadow-sm space-y-2">
                            <div className="flex justify-between items-start">
                              <div>
                                <p className="text-[10px] text-slate-400 font-bold">
                                  📅 {dataExibicao ? new Date(dataExibicao + 'T00:00:00').toLocaleDateString('pt-BR') : 'Data não definida'} às {c.hora || '14:00'}
                                </p>
                                <h3 className="font-bold text-slate-800 text-sm mt-0.5">{c.paciente_nome}</h3>
                                <p className="text-xs text-rose-900 font-semibold">{c.procedimento} {c.sessao ? `(${c.sessao})` : ''}</p>
                              </div>

                              <div className="text-right">
                                <span className="font-extrabold text-slate-900 text-sm block">
                                  R$ {Number(c.valor || 0).toFixed(2)}
                                </span>
                                <span className={`px-2 py-0.5 text-[9px] font-bold rounded-lg inline-block mt-1 ${
                                  foiPago ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-900'
                                }`}>
                                  {foiPago ? '✅ Recebido' : '⏳ A Receber'}
                                </span>
                              </div>
                            </div>

                            {!foiPago && (
                              <button 
                                onClick={() => handleConfirmarPagamento(c.id)}
                                className="w-full mt-2 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-xl shadow-sm flex items-center justify-center gap-1.5 active:scale-95 transition-all"
                              >
                                <IconCheck /> <span>Confirmar que o dinheiro entrou</span>
                              </button>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )
                )}
              </div>
            )}

          </main>

          {/* MODAL ADICIONAR SAÍDA DE CAIXA */}
          {showNovaSaida && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-4">
              <div className="bg-white w-full max-w-md rounded-3xl p-5 space-y-3">
                <h3 className="text-sm font-bold text-slate-800 uppercase tracking-wider">Adicionar Saída de Caixa</h3>
                <form onSubmit={handleAddSaida} className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold text-slate-600 block mb-1">Tipo / Categoria da Saída *</label>
                    <select 
                      className="w-full p-3 bg-slate-50 border rounded-2xl font-bold text-rose-900"
                      value={formSaida.categoria}
                      onChange={e => setFormSaida({...formSaida, categoria: e.target.value})}
                    >
                      {OPCOES_SAIDA.map(o => <option key={o} value={o}>{o}</option>)}
                    </select>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-bold text-slate-600 block mb-1">Valor (R$) *</label>
                      <input 
                        type="number" 
                        step="0.01"
                        required 
                        placeholder="Ex: 50.00" 
                        className="w-full p-3 bg-slate-50 border rounded-2xl" 
                        value={formSaida.valor} 
                        onChange={e => setFormSaida({...formSaida, valor: e.target.value})} 
                      />
                    </div>
                    <div>
                      <label className="font-bold text-slate-600 block mb-1">Data *</label>
                      <input 
                        type="date" 
                        required 
                        className="w-full p-3 bg-slate-50 border rounded-2xl" 
                        value={formSaida.data} 
                        onChange={e => setFormSaida({...formSaida, data: e.target.value})} 
                      />
                    </div>
                  </div>

                  <div>
                    <label className="font-bold text-slate-600 block mb-1">Observações / Descrição *</label>
                    <textarea 
                      placeholder="Descreva aqui os detalhes desta saída..." 
                      className="w-full p-3 bg-slate-50 border rounded-2xl h-20" 
                      value={formSaida.observacoes} 
                      onChange={e => setFormSaida({...formSaida, observacoes: e.target.value})} 
                    />
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button type="button" onClick={() => setShowNovaSaida(false)} className="w-1/2 p-3 bg-slate-100 font-bold rounded-2xl text-slate-600">Cancelar</button>
                    <button type="submit" className="w-1/2 p-3 bg-rose-900 font-bold text-white rounded-2xl">Salvar Saída</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL CONFIGURAR MENSAGEM DO WHATSAPP */}
          {showConfigMsg && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-md rounded-3xl p-5 space-y-3">
                <h3 className="text-sm font-bold text-slate-800 uppercase tracking-wider">Personalizar Mensagem do WhatsApp</h3>
                <p className="text-[11px] text-slate-500 leading-relaxed">
                  Utilize as variáveis abaixo no texto para que o sistema substitua automaticamente:
                  <br />
                  <code className="bg-slate-100 px-1 rounded text-rose-800 font-bold">{'{paciente}'}</code>, 
                  <code className="bg-slate-100 px-1 rounded text-rose-800 font-bold">{'{procedimento}'}</code>, 
                  <code className="bg-slate-100 px-1 rounded text-rose-800 font-bold">{'{data}'}</code>, 
                  <code className="bg-slate-100 px-1 rounded text-rose-800 font-bold">{'{hora}'}</code>, 
                  <code className="bg-slate-100 px-1 rounded text-rose-800 font-bold">{'{link}'}</code>
                </p>

                <textarea 
                  rows="6" 
                  className="w-full p-3 bg-slate-50 border rounded-2xl text-xs font-mono"
                  value={templateMsg}
                  onChange={e => salvarTemplateMsg(e.target.value)}
                />

                <div className="flex justify-end pt-2">
                  <button onClick={() => setShowConfigMsg(false)} className="px-5 py-2.5 bg-rose-900 text-white font-bold rounded-2xl text-xs">
                    Guardar
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL CADASTRAR PACIENTE */}
          {showNovoPaciente && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-4">
              <div className="bg-white w-full max-w-md rounded-3xl p-5 space-y-3">
                <h3 className="text-sm font-bold text-slate-800 uppercase tracking-wider">Cadastrar Paciente</h3>
                <form onSubmit={handleAddPaciente} className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold text-slate-600 block mb-0.5">Nome Completo *</label>
                    <input required placeholder="Nome Completo *" className="w-full p-3 bg-slate-50 border rounded-2xl" value={formPaciente.nome} onChange={e => setFormPaciente({...formPaciente, nome: e.target.value})} />
                  </div>

                  <div>
                    <label className="font-bold text-slate-600 block mb-0.5">Telefone / WhatsApp *</label>
                    <input required placeholder="Telefone / WhatsApp *" className="w-full p-3 bg-slate-50 border rounded-2xl" value={formPaciente.telefone} onChange={e => setFormPaciente({...formPaciente, telefone: e.target.value})} />
                  </div>

                  <div>
                    <label className="font-bold text-slate-600 block mb-0.5">Data de Nascimento</label>
                    <input type="date" className="w-full p-3 bg-slate-50 border rounded-2xl" value={formPaciente.data_nascimento} onChange={e => setFormPaciente({...formPaciente, data_nascimento: e.target.value})} />
                  </div>

                  <div>
                    <label className="font-bold text-slate-600 block mb-0.5">Observações Gerais</label>
                    <textarea placeholder="Observações sobre a paciente..." className="w-full p-3 bg-slate-50 border rounded-2xl h-14" value={formPaciente.observacoes} onChange={e => setFormPaciente({...formPaciente, observacoes: e.target.value})} />
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button type="button" onClick={() => setShowNovoPaciente(false)} className="w-1/2 p-3 bg-slate-100 font-bold rounded-2xl text-slate-600">Cancelar</button>
                    <button type="submit" className="w-1/2 p-3 bg-rose-900 font-bold text-white rounded-2xl">Salvar Paciente</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL AGENDAR CONSULTA */}
          {showNovaConsulta && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-4">
              <div className="bg-white w-full max-w-md rounded-3xl p-5 space-y-3 max-h-[90vh] overflow-y-auto">
                <h3 className="text-sm font-bold text-slate-800 uppercase tracking-wider">Incluir Agendamento</h3>
                <form onSubmit={handleAddConsulta} className="space-y-3 text-xs">
                  <div>
                    <label className="font-bold text-slate-600 block mb-1">Paciente *</label>
                    <select required className="w-full p-3 bg-slate-50 border rounded-2xl" value={formConsulta.paciente_id} onChange={e => {
                      const p = pacientes.find(p => p.id === e.target.value);
                      setFormConsulta({...formConsulta, paciente_id: e.target.value, paciente_nome: p ? p.nome : ''});
                    }}>
                      <option value="">-- Selecione --</option>
                      {pacientes.map(p => <option key={p.id} value={p.id}>{p.nome}</option>)}
                    </select>
                  </div>

                  <div>
                    <label className="font-bold text-slate-600 block mb-1">Procedimento *</label>
                    <select className="w-full p-3 bg-slate-50 border rounded-2xl" value={formConsulta.procedimento} onChange={e => setFormConsulta({...formConsulta, procedimento: e.target.value})}>
                      {PROCEDIMENTOS_PRESET.map(proc => <option key={proc.nome} value={proc.nome}>{proc.nome}</option>)}
                    </select>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-bold text-slate-600 block mb-1">Duração *</label>
                      <select className="w-full p-3 bg-slate-50 border rounded-2xl" value={formConsulta.duracao} onChange={e => setFormConsulta({...formConsulta, duracao: e.target.value})}>
                        {OPCOES_DURACAO.map(d => <option key={d} value={d}>{d}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="font-bold text-slate-600 block mb-1">Data *</label>
                      <input type="date" required className="w-full p-3 bg-slate-50 border rounded-2xl" value={formConsulta.data} onChange={e => setFormConsulta({...formConsulta, data: e.target.value})} />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="font-bold text-slate-600 block mb-1">Horário *</label>
                      <input type="time" required className="w-full p-3 bg-slate-50 border rounded-2xl" value={formConsulta.hora} onChange={e => setFormConsulta({...formConsulta, hora: e.target.value})} />
                    </div>
                    <div>
                      <label className="font-bold text-slate-600 block mb-1">Valor (R$)</label>
                      <input type="number" placeholder="350" className="w-full p-3 bg-slate-50 border rounded-2xl" value={formConsulta.valor} onChange={e => setFormConsulta({...formConsulta, valor: e.target.value})} />
                    </div>
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button type="button" onClick={() => setShowNovaConsulta(false)} className="w-1/2 p-3 bg-slate-100 font-bold rounded-2xl">Cancelar</button>
                    <button type="submit" className="w-1/2 p-3 bg-rose-900 font-bold text-white rounded-2xl">Confirmar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Menu Flutuante Inferior */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto glass-nav border-t px-4 py-2 flex justify-around text-[10px] font-bold text-slate-400 z-20">
            <button onClick={() => { setActiveTab('dashboard'); setSelectedPaciente(null); }} className={`flex flex-col items-center gap-1 ${activeTab === 'dashboard' ? 'text-rose-900 font-black' : ''}`}>
              <IconHome /> <span>Início</span>
            </button>
            <button onClick={() => { setActiveTab('pacientes'); setSelectedPaciente(null); }} className={`flex flex-col items-center gap-1 ${activeTab === 'pacientes' ? 'text-rose-900 font-black' : ''}`}>
              <IconUsers /> <span>Pacientes</span>
            </button>
            <button onClick={() => { setActiveTab('agenda'); setSelectedPaciente(null); }} className={`flex flex-col items-center gap-1 ${activeTab === 'agenda' ? 'text-rose-900 font-black' : ''}`}>
              <IconCalendar /> <span>Agenda</span>
            </button>
            <button onClick={() => { setActiveTab('financeiro'); setSelectedPaciente(null); }} className={`flex flex-col items-center gap-1 ${activeTab === 'financeiro' ? 'text-rose-900 font-black' : ''}`}>
              <IconDollar /> <span>Financeiro</span>
            </button>
          </nav>

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
